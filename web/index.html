}

// 书轨 = 一张连贯的线路图：主线/支线/换乘线画在同一个坐标系里，点站开书，发车动画
const RG_W = 1320, RG_LEFT = 118, RG_RIGHT = 46, RG_TOP = 116, RG_GAP = 172;
let railLanes = [];
let railAnim = 0;

window.mmRailDepart = function () {
  const svg = document.getElementById('rgSvg');
  if (!svg || !railLanes.length) return;
  cancelAnimationFrame(railAnim);
  const trains = Array.from(svg.querySelectorAll('.rg-train'));
  railLanes.forEach((lane) => lane.stops.forEach((el) => el.classList.remove('lit')));
  const t0 = performance.now();
  const DUR = 4200, STAGGER = 380;
  const frame = (now) => {
    if (!document.getElementById('rgSvg')) { cancelAnimationFrame(railAnim); return; }
    let running = false;
    railLanes.forEach((lane, li) => {
      const g = trains[li];
      if (!g) return;
      const start = t0 + li * STAGGER;
      if (now < start) { running = true; return; }
      const total = Math.max(1, lane.xs.length - 1);
      const p = Math.min(1, (now - start) / DUR);
      const f = p * total;
      const i = Math.min(total - 1, Math.floor(f));
      const frac = f - i;
      const x = lane.xs[i] + (lane.xs[i + 1] - lane.xs[i]) * frac;
      g.setAttribute('transform', `translate(${x},${lane.y})`);
      g.setAttribute('opacity', p >= 1 ? '0' : '1');
      const upto = Math.floor(f) + 1;
      lane.stops.forEach((el, k) => { if (k < upto) el.classList.add('lit'); });
      if (p < 1) running = true;
    });
    if (running) railAnim = requestAnimationFrame(frame);
  };
  railAnim = requestAnimationFrame(frame);
};

async function showRail() {
  document.body.classList.add('grid');
  state.findMarks = []; state.global = []; state.chapterMain = '';
  app.innerHTML = '<div class="empty">正在铺设书轨……</div>';
  const [rail, catalog] = await Promise.all([ensureRail(), ensureCatalog()]);
  if (!rail || !Array.isArray(rail.lines)) {
    app.innerHTML = '<div class="empty">书轨数据还没铺好，先去书架视图看看。</div>';
    return;
  }
  const bookIndex = {};
  catalog.forEach((b) => { bookIndex[b.id] = b; });

  const cut = (s, n) => {
    s = String(s == null ? '' : s);
    return s.length > n ? s.slice(0, n - 1) + '…' : s;
  };
  const yearOf = (s) => {
    const m = String(s && s.year != null ? s.year : '').match(/\d{4}/);
    return m ? Number(m[0]) : null;
  };

  const allYears = [];
  rail.lines.forEach((l) => {
    l.stops.forEach((s) => { const y = yearOf(s); if (y) allYears.push(y); });
    (l.branches || []).forEach((br) => br.stops.forEach((s) => { const y = yearOf(s); if (y) allYears.push(y); }));
  });
  const minYear = Math.min(...allYears);
  const maxYear = Math.max(...allYears);
  const xOfYear = (yr) => RG_LEFT + ((yr - minYear) / Math.max(1, maxYear - minYear)) * (RG_W - RG_LEFT - RG_RIGHT);

  // 所有站点在同一个坐标系里的位置：用于画换乘曲线
  const positions = {};
  const addPos = (book, x, y, laneIdx) => {
    (positions[book] || (positions[book] = [])).push({ x, y, laneIdx });
  };

  // 主线：按年份定位；同一条线上过近的站点右推，最后整体压缩进画布
  const laneXs = [];
  rail.lines.forEach((l) => {
    let prev = -1e9;
    let xs = l.stops.map((s) => {
      const yr = yearOf(s);
      let x = yr ? xOfYear(yr) : RG_LEFT;
      if (x < prev + 112) x = prev + 112;
      prev = x;
      return x;
    });
    const right = RG_W - RG_RIGHT;
    if (xs.length && xs[xs.length - 1] > right) {
      const span = xs[xs.length - 1] - xs[0] || 1;
      const target = right - RG_LEFT;
      xs = xs.map((x) => RG_LEFT + ((x - xs[0]) / span) * target);
    }
    laneXs.push(xs);
  });

  rail.lines.forEach((l, li) => {
    const y = RG_TOP + li * RG_GAP;
    l.stops.forEach((s, si) => addPos(s.book, laneXs[li][si], y, li));
  });

  // 支线：挂在主线下方，用虚线接出去
  const branchRows = [];
  rail.lines.forEach((l, li) => {
    const y = RG_TOP + li * RG_GAP;
    (l.branches || []).forEach((br, bi) => {
      const by = y + 58 + bi * 48;
      const fromMatch = String(br.from || '').match(/\d{4}/);
      const originX = fromMatch ? xOfYear(Number(fromMatch[0])) : laneXs[li][0];
      const startX = Math.min(Math.max(originX + 26, RG_LEFT), RG_W - RG_RIGHT - 80);
      let bxs = br.stops.map((s, i) => Math.min(RG_W - RG_RIGHT, startX + i * 148));
      if (bxs.length && bxs[bxs.length - 1] > RG_W - RG_RIGHT) {
        const span = bxs[bxs.length - 1] - bxs[0] || 1;
        const target = Math.max(80, (RG_W - RG_RIGHT) - bxs[0]);
        bxs = bxs.map((x) => bxs[0] + ((x - bxs[0]) / span) * target);
      }
      br.stops.forEach((s, i) => addPos(s.book, bxs[i], by, li));
      branchRows.push({ br, y: by, originX, xs: bxs, color: br.color || l.color });
    });
  });

  const laneY = (li) => RG_TOP + li * RG_GAP;
  const multiBook = (book) => (positions[book] || []).length > 1;

  // 换乘线：同一本书在不同线路上的位置用虚线连起来（默认很淡，悬停才亮）
  const xferSvg = Object.keys(positions).filter(multiBook).map((book) => {
    const arr = positions[book].slice().sort((a, b) => a.y - b.y);
    const parts = [];
    for (let i = 0; i < arr.length - 1; i++) {
      const a = arr[i], b = arr[i + 1];
      const my = (a.y + b.y) / 2;
      parts.push(`<path class="rg-xfer" data-book="${esc(book)}" pointer-events="none" d="M${a.x} ${a.y} C ${a.x} ${my}, ${b.x} ${my}, ${b.x} ${b.y}" />`);
    }
    return parts.join('');
  }).join('');

  const stopSvg = (s, x, y, color, delay) => {
    const b = bookIndex[s.book] || {};
    const multi = multiBook(s.book);
    const title = `${s.year} · ${s.label}${s.note ? '\n' + s.note : ''}${b.title ? '\n' + (b.call || '') + ' · ' + b.title : ''}`;
    // 靠边的站点把标签向内对齐，避免被画布裁掉
    const anchor = x > RG_W - RG_RIGHT - 110 ? 'end' : (x < RG_LEFT + 70 ? 'start' : 'middle');
    const markX = anchor === 'end' ? -11 : 11;
    return `<g class="rg-stop" data-book="${esc(s.book)}" style="--d:${Number(delay) || 0}ms" transform="translate(${x},${y})">
      <title>${esc(title)}</title>
      <circle class="rg-halo" r="13" fill="${color}" opacity=".14"></circle>
      <circle class="rg-dot" r="5" fill="${color}"></circle>
      <text class="rg-year" y="-12" text-anchor="${anchor}">${esc(String(s.year))}</text>
      <text class="rg-label" y="21" text-anchor="${anchor}">${esc(cut(s.label, 10))}</text>
      <text class="rg-book" y="35" text-anchor="${anchor}">${esc(b.call || '')}${b.title ? ' · ' + esc(cut(b.title, 8)) : ''}</text>
      ${multi ? `<text class="rg-xfermark" x="${markX}" y="-12">⇄</text>` : ''}
    </g>`;
  };

  const branchStopSvg = (s, x, y, color, delay) => {
    const multi = multiBook(s.book);
    const title = `${s.year} · ${s.label}${s.note ? '\n' + s.note : ''}`;
    const anchor = x > RG_W - RG_RIGHT - 200 ? 'end' : 'start';
    const tx = anchor === 'end' ? -9 : 9;
    return `<g class="rg-stop" data-book="${esc(s.book)}" style="--d:${Number(delay) || 0}ms" transform="translate(${x},${y})">
      <title>${esc(title)}</title>
      <circle class="rg-dot" r="4" fill="${color}"></circle>
      <text x="${tx}" y="4" text-anchor="${anchor}" fill="#a8977a" font-size="10.5">${esc(String(s.year))} · ${esc(cut(s.label, 15))}${multi ? ' ⇄' : ''}</text>
    </g>`;
  };

  const nLines = rail.lines.length;
  const svgH = RG_TOP + (nLines - 1) * RG_GAP + 156;

  const lanesSvg = rail.lines.map((l, li) => {
    const y = laneY(li);
    const x2 = RG_W - RG_RIGHT;
    return `
      <rect x="40" y="${y - 58}" width="${RG_W - 80}" height="${RG_GAP - 34}" fill="rgba(200,162,74,${li % 2 ? 0.02 : 0.04})" pointer-events="none"></rect>
      <line x1="72" x2="${x2}" y1="${y}" y2="${y}" stroke="${l.color}" stroke-width="9" opacity=".05" pointer-events="none"></line>
      <line class="rg-lane-core" x1="72" x2="${x2}" y1="${y}" y2="${y}" stroke="${l.color}" stroke-width="2.2" opacity=".62" pathLength="1" style="animation-delay:${li * 90}ms" pointer-events="none"></line>
      <text x="60" y="${y - 34}" fill="${l.color}" font-size="13" letter-spacing="2" pointer-events="none">${esc(l.name)}</text>
      ${l.stops.map((s, si) => stopSvg(s, laneXs[li][si], y, l.color, 260 + li * 80 + si * 22)).join('')}`;
  }).join('');

  const branchesSvg = branchRows.map(({ br, y, originX, xs, color }) => {
    const xEnd = xs[xs.length - 1] == null ? originX : xs[xs.length - 1];
    return `
      <path d="M${originX} ${y - 62} Q ${originX + 18} ${y - 28}, ${xs[0]} ${y} L ${xEnd} ${y}" stroke="${color}" stroke-width="1.2" stroke-dasharray="4 4" fill="none" opacity=".55" pointer-events="none"></path>
      <text x="${xs[0]}" y="${y - 10}" fill="${color}" font-size="10.5" opacity=".9" pointer-events="none">↳ ${esc(cut(br.name, 16))}</text>
      ${br.stops.map((s, i) => branchStopSvg(s, xs[i], y, color, 420 + i * 30)).join('')}`;
  }).join('');

  // 车头 + 向后拖尾（负 x 在车头左侧，随车一起平移）
  const trainsSvg = rail.lines.map((l) => `<g class="rg-train" opacity="0">
      <circle r="16" fill="${l.color}" opacity=".08"></circle>
      <circle r="11" cx="-22" fill="${l.color}" opacity=".14"></circle>
      <circle r="7" cx="-42" fill="${l.color}" opacity=".08"></circle>
      <circle r="11" fill="${l.color}" opacity=".25"></circle>
      <circle r="4" fill="#fff6d8"></circle>
    </g>`).join('');

  const legend = rail.lines.map((l) => `<span class="rg-line-chip" title="${esc(l.desc || '')}"><i style="background:${l.color}"></i>${esc(l.name)}</span>`).join('');
  const stopTotal = rail.lines.reduce((n, l) => n + l.stops.length + (l.branches || []).reduce((m, b) => m + b.stops.length, 0), 0);

  app.innerHTML = `
  <div class="rail-view">
    <div class="rail-head"><span>书轨 · 主题线路图</span>
      <span class="head-links"><a onclick="enterOverview()">书架总览 →</a> · <a onclick="enterShelf()">书架视图 →</a> · <a onclick="enterTimeline()">时间轴 →</a></span>
    </div>
    <div class="rail-sub">五条主线、七条支线，共 ${stopTotal} 个站点。同一个书名出现在两条线上，就是一座换乘站——悬停任一站点，会亮起它在别的线路上的位置。</div>
    <div class="rg-toolbar">
      <button class="rg-depart" onclick="mmRailDepart()">▶ 发车</button>
      <div class="rg-lines">${legend}</div>
      <span class="rg-note">⇄ = 换乘 · 点站点直接开书</span>
    </div>
    <div class="rg-scroll">
      <svg id="rgSvg" class="rg-svg" viewBox="0 0 ${RG_W} ${svgH}" width="${RG_W}" height="${svgH}" role="img" aria-label="AI 知识主题线路图">
        ${xferSvg}
        ${lanesSvg}
        ${branchesSvg}
        ${trainsSvg}
      </svg>
    </div>
    <div class="rail-hintbar">线路只取主干站，完整细节在书里。轨道铺到 2026 年为止；再往后只能靠你自己找。</div>
  </div>`;

  // 悬停聚焦同一本书的所有站点与换乘连线；点击开书
  const svg = document.getElementById('rgSvg');
  if (!svg) return;
  const focusBook = (book) => {
    if (!book) return;
    svg.classList.add('rg-focus');
    svg.querySelectorAll('.rg-stop, .rg-xfer').forEach((el) => {
      el.classList.toggle('rg-hi', el.dataset.book === book);
    });
  };
  const clearFocus = () => {
    svg.classList.remove('rg-focus');
    svg.querySelectorAll('.rg-hi').forEach((el) => el.classList.remove('rg-hi'));
  };
  svg.addEventListener('mouseover', (e) => {
    const g = e.target.closest('.rg-stop');
    if (g) focusBook(g.dataset.book);
  });
  svg.addEventListener('mouseout', (e) => {
    const g = e.target.closest('.rg-stop');
    if (!g) return;
    // 在同一个站点的子元素之间移动时不要反复清除高亮
    const to = e.relatedTarget && e.relatedTarget.closest ? e.relatedTarget.closest('.rg-stop') : null;
    if (to === g) return;
    clearFocus();
  });
  svg.addEventListener('click', (e) => {
    const g = e.target.closest('.rg-stop');
    if (g && typeof openBookFirst === 'function') openBookFirst(g.dataset.book);
  });

  // 供发车动画使用：每条主线的纵坐标、站点横坐标、站点元素
  railLanes = rail.lines.map((l, li) => ({
    y: laneY(li),
    xs: laneXs[li],
    stops: Array.from(svg.querySelectorAll('.rg-stop')).filter((el) => {
      const t = el.getAttribute('transform') || '';
      const m = t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
      return m && Math.abs(Number(m[2]) - laneY(li)) < 1;
    }),
  }));
  // 等轨道铺开动画走完再发车，避免入场动画和列车同时抢帧
  setTimeout(() => { if (document.getElementById('rgSvg')) mmRailDepart(); }, 320);
}

async function showShelves(floor) {
  shelfFloor = floor || (window.mm3d && window.mm3d.getFloor ? window.mm3d.getFloor() : shelfFloor) || 'all';
  document.body.classList.add('grid');
  state.findMarks = []; state.global = []; state.chapterMain = '';
  app.innerHTML = '<div class="empty">正在取出书架……</div>';
  const [catalog, floors] = await Promise.all([ensureCatalog(), ensureFloors()]);
  await ensureShelfConfig();
  const active = shelfFloor;
  // 与 3D 同步：在书架视图选层后，3D 也切到同一层
  if (floor && window.mm3d && window.mm3d.getFloor && window.mm3d.getFloor() !== floor) {
    try { window.mm3d.setFloor(floor, true); } catch (e) { console.warn('[sync] 3D 切层失败', e); }
  }
  const visible = active === 'all' ? catalog : catalog.filter((b) => b.floor === active);
  const perBoard = Math.max(1, Number(shelfConfig.booksPerBoard) || 3);
  const boardsPerUnit = Math.max(1, Number(shelfConfig.boardsPerUnit) || 2);
  const capacity = perBoard * boardsPerUnit;
  const cols = Math.max(1, Math.ceil(visible.length / capacity));
  const units = [];
  for (let c = 0; c < cols; c++) {
    const slice = visible.slice(c * capacity, (c + 1) * capacity);
    const boards = [];
    for (let b = 0; b < boardsPerUnit; b++) boards.push(slice.slice(b * perBoard, (b + 1) * perBoard));
    units.push({ boards });
  }
  const spineHtml = (b) => `
    <div class="book-spine" style="background:linear-gradient(180deg, ${b.color}, ${shade(b.color, 0.55)})"
         title="${esc(b.title)}（已入库 ${b.chapters.length}/8 章）" onclick="openBookFirst('${b.id}')">

      <span class="c">${esc(b.call)}</span>

  const decayLbl = ['完好', '轻残', '中残', '高残'];
  const elevHtml = ['all', ...floors.map((f) => f.id)].map((id) => {
    const f = id === 'all' ? null : floors.find((x) => x.id === id);

    const sub = f ? `等级 ${f.tier} · ${decayLbl[f.decay] || '残'} · ${f.librarian}` : `${Math.max(1, Math.ceil(catalog.length / capacity))} 组书架 · ${catalog.length} 本`;
    return `<button class="elev-btn ${active === id ? 'active' : ''}" onclick="showShelves('${id}')"><span>${esc(label)}</span><i>${esc(sub)}</i></button>`;
  }).join('');
  const cur = active === 'all' ? null : floors.find((f) => f.id === active);
  const welcome = cur
    ? `${cur.name} · ${cur.librarian}：${cur.welcome}`
    : '全馆大厅：全馆的书架都在，慢慢看。';
  app.innerHTML = `
  <div class="shelf-view">
    <aside class="shelf-elevator">
      <div class="elev-title">黄铜电梯 · 选层</div>
      ${elevHtml}
      <div class="elev-welcome">${esc(welcome)}</div>
      <div class="elev-links"><a onclick="enterOverview()">→ 书架总览（全部书目）</a></div>
    </aside>
    <main class="shelf-main">
      ${units.map((u) => `
        <div class="unit">
          ${u.boards.map((board) => `<div class="board">${board.map(spineHtml).join('')}</div>`).join('')}
        </div>`).join('')}
      ${visible.length === 0 ? '<div class="empty">这一层暂时没有样章</div>' : ''}
    </main>
  </div>`;
}

// ---------- 阅读三栏 ----------
function splitNotes(content) {
  const i = content.indexOf('## 页边注');
  if (i < 0) return { main: content, notes: [] };
  const main = content.slice(0, i);
  const notes = content.slice(i + '## 页边注'.length)
    .split(/\r?\n/).map((l) => l.trim())
    .filter((l) => l.startsWith('- '))
    .map((l) => {
      const t = l.slice(2).trim();
      const mm = t.match(/^〔(.+?)〕\s*(.+)$/);
      return mm ? { anchor: mm[1], text: mm[2] } : { anchor: '', text: t };
    });
  return { main, notes };
}

// ---------- 章节总结卡 ----------
function mmSectionFirstSentence(md, heading) {
  const src = String(md || '');
  const at = src.indexOf('## ' + heading);
  if (at < 0) return '';
  const lineEnd = src.indexOf('\n', at);
  if (lineEnd < 0) return '';
  const rest = src.slice(lineEnd + 1);
  const next = rest.search(/\n##\s+/);
  const body = (next >= 0 ? rest.slice(0, next) : rest).replace(/\s+/g, ' ').trim();
  if (!body) return '';
  const hit = body.match(/^(.+?[。！？!?])/);
  return (hit ? hit[1] : body).trim();
}

function ccWrapText(ctx, text, maxWidth) {
  const chars = Array.from(String(text == null ? '' : text));
  const lines = [];
  let line = '';
  for (const ch of chars) {
    if (ch === '\n') { lines.push(line); line = ''; continue; }
    if (line && ctx.measureText(line + ch).width > maxWidth) { lines.push(line); line = ch; }
    else line += ch;
  }
  if (line) lines.push(line);
  return lines;
}

function ccDrawText(ctx, text, x, y, maxWidth, lineHeight, maxLines, font, color, align) {
  ctx.save();
  ctx.font = font;
  ctx.fillStyle = color;
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'alphabetic';
  let lines = ccWrapText(ctx, text, maxWidth);
  if (lines.length > maxLines) {
    lines = lines.slice(0, maxLines);
    lines[maxLines - 1] = lines[maxLines - 1].replace(/[，、；。！？]$/, '') + '…';
  }
  lines.forEach((ln, i) => ctx.fillText(ln, x, y + i * lineHeight));
  ctx.restore();
  return y + lines.length * lineHeight;
}

function downloadChapterCard(id) {
  const card = window.__mmCard && window.__mmCard[id];
  if (!card) { mmToast('总结卡还没装订好。'); return; }
  const detail = String(id).match(/^(.+)-c(\d+)$/);
  const bookId = detail ? detail[1] : '';
  const bookNo = detail ? detail[2].padStart(2, '0') : '';
  const shelfMark = bookCalls[bookId] || ((catalogCache.find((b) => b.id === bookId) || {}).call) || '?';
  const callNo = bookId ? `${shelfMark}-${bookNo}` : id;

  const W = 900, H = 1200;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const SERIF = '"Songti SC","SimSun",serif';
  const MONO = '"Consolas","Microsoft YaHei",monospace';
  const LABEL = 'bold 18px ' + SERIF;

  ctx.fillStyle = '#efe3c6';
  ctx.fillRect(0, 0, W, H);
  for (let y = 72; y < H; y += 30) {
    ctx.strokeStyle = 'rgba(90,69,31,.035)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(60, y); ctx.lineTo(W - 60, y); ctx.stroke();
  }
  ctx.strokeStyle = '#5a451f'; ctx.lineWidth = 5;
  ctx.strokeRect(30, 30, W - 60, H - 60);
  ctx.strokeStyle = '#8a6320'; ctx.lineWidth = 1.2;
  ctx.strokeRect(46, 46, W - 92, H - 92);
  ctx.strokeStyle = 'rgba(138,99,32,.7)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(76, 92); ctx.lineTo(76, H - 92); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W - 76, 92); ctx.lineTo(W - 76, H - 92); ctx.stroke();
  [[76, 100], [W - 76, 100], [76, H - 100], [W - 76, H - 100]].forEach(([cx, cy]) => {
    ctx.beginPath();
    ctx.moveTo(cx, cy - 5); ctx.lineTo(cx + 5, cy); ctx.lineTo(cx, cy + 5); ctx.lineTo(cx - 5, cy);
    ctx.closePath(); ctx.fillStyle = '#8a6320'; ctx.fill();
  });

  ctx.textAlign = 'center';
  ctx.fillStyle = '#8a6d33';
  ctx.font = '16px ' + MONO;
  ctx.fillText('机忆书库 · 章节总结卡', W / 2, 98);
  ctx.font = '11px ' + MONO;
  ctx.fillText('THE MACHINE MEMORY · CHAPTER CARD', W / 2, 118);

  let y = 186;
  y = ccDrawText(ctx, card.title, W / 2, y, 700, 56, 2, 'bold 42px ' + SERIF, '#3b3020', 'center');
  ctx.textAlign = 'center';
  ctx.fillStyle = '#6b5a3a';
  ctx.font = '20px ' + SERIF;
  ctx.fillText(`年代 ${card.year || '——'} · 索书号 ${callNo}`, W / 2, y + 30);
  y += 64;
  ctx.strokeStyle = '#8a6320'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(150, y); ctx.lineTo(W - 150, y); ctx.stroke();
  y += 48;

  ctx.textAlign = 'left';
  ctx.fillStyle = '#8a6d33';
  ctx.font = LABEL;
  ctx.fillText('关键人物', 110, y);
  y += 30;
  (card.people.length ? card.people : ['档案没有署名']).forEach((p, i) => {
    y = ccDrawText(ctx, `${i + 1}. ${p}`, 110, y, 680, 30, 1, '19px ' + SERIF, '#4a3a24', 'left');
    y += 4;
  });
  y += 14;

  ctx.fillStyle = '#8a6d33'; ctx.font = LABEL;
  ctx.fillText('一句话', 110, y);
  y += 30;
  y = ccDrawText(ctx, '「' + (card.quote || '——') + '」', 110, y, 680, 34, 4, '22px ' + SERIF, '#5a451f', 'left');
  y += 16;

  ctx.fillStyle = '#8a6d33'; ctx.font = LABEL;
  ctx.fillText('争议点', 110, y);
  y += 30;
  y = ccDrawText(ctx, card.dispute || '——', 110, y, 680, 28, 4, '18px ' + SERIF, '#6b5a3a', 'left');
  y += 16;

  ctx.fillStyle = '#8a6d33'; ctx.font = LABEL;
  ctx.fillText('来源 · 前三条', 110, y);
  y += 30;
  (card.sources.length ? card.sources : ['——']).slice(0, 3).forEach((s, i) => {
    y = ccDrawText(ctx, `${i + 1}. ${s}`, 110, y, 680, 24, 2, '15px ' + SERIF, '#8a7a5c', 'left');
    y += 4;
  });

  ctx.textAlign = 'center';
  ctx.fillStyle = '#8a6d33';
  ctx.font = '14px ' + SERIF;
  ctx.fillText(`机忆书库 · THE MACHINE MEMORY · ${callNo}`, W / 2, 1128);

  const a = document.createElement('a');
  a.href = cv.toDataURL('image/png');
  a.download = `总结卡-${id}.png`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  mmToast('总结卡已导出。');
}

// 从已经加载的目录里取某一章的简报（供「继续读」区块使用）
function chapterBrief(id) {
  if (!id) return null;
  for (const b of catalogCache) {
    const c = (b.chapters || []).find((x) => x.id === id);
    if (c) return { id, title: c.title, year: c.year, bookTitle: b.title, call: b.call, no: c.no };
  }
  return { id, title: id, year: '', bookTitle: '', call: '', no: 0 };
}

async function showChapter(id) {
  document.body.classList.add('reading');
  const r = await (await fetch('api/chapters/' + id)).json();
  await loadCollectData();
  // 章末导航需要目录里的标题；目录很轻（一次约 53KB，之后走缓存）
  if (!catalogCache.length) { try { await ensureCatalog(); } catch (e) { /* 目录失败时退化为只显示章号 */ } }
  const m = r.meta;
  window.__mmChapterMeta = m;
  const { main, notes } = splitNotes(r.content);
  state.chapterMain = main;
  state.findMarks = []; state.global = [];
  const librarian = LIBRARIANS[bookFloors[m.book]] || '当值馆员';
  const callNo = `${bookCalls[m.book] || '?'}-${String(m.no || 0).padStart(2, '0')}`;
  const summary = String(m.summary || '').split(/[。．.]/)[0].trim();
  const purpose = summary.length > 46 ? summary.slice(0, 46) + '…' : summary;
  const fl = floorInfo[bookFloors[m.book]] || null;
  const roman = ['I', 'II', 'III', 'IV'][((fl ? fl.tier : 1) - 1)] || 'I';
  const decayTxt = ['完好', '轻残', '中残', '高残'][fl ? fl.decay : 0] || '完好';
  const cardData = mmChapterCardData(m, main);
  window.__mmCard = window.__mmCard || {};
  window.__mmCard[m.id] = cardData;
  // 章末「继续读」：优先用 meta.relations 的上一章/下一章，缺失时按章号兜底
  const rel = m.relations || {};
  const curBook = catalogCache.find((b) => b.id === m.book) || null;
  const chapterList = (curBook && curBook.chapters) || [];
  const prevId = (rel.prev || [])[0] || (chapterList.find((c) => c.no === m.no - 1) || {}).id;
  const nextId = (rel.next || [])[0] || (chapterList.find((c) => c.no === m.no + 1) || {}).id;
  const transitIds = (rel.transit || []).slice(0, 4);
  const prevB = chapterBrief(prevId);
  const nextB = chapterBrief(nextId);
  const readNextHtml = `
    <div class="read-next">
      <div class="rn-head">继续读<span>《${esc(curBook ? curBook.title : (bookNames[m.book] || m.book))}》· 第 ${esc(String(m.no || 1))} / ${chapterList.length || 8} 章</span></div>
      <div class="rn-pair">
        ${prevB
          ? `<button class="rn-btn" onclick="showChapter('${esc(prevB.id)}')"><b>← 上一章</b><i>${esc(prevB.title)} · ${esc(prevB.year || '')}</i></button>`
          : '<button class="rn-btn" disabled><b>← 上一章</b><i>这是本书第一章</i></button>'}
        ${nextB
          ? `<button class="rn-btn next" onclick="showChapter('${esc(nextB.id)}')"><b>下一章 →</b><i>${esc(nextB.title)} · ${esc(nextB.year || '')}</i></button>`
          : '<button class="rn-btn next" onclick="enterOverview()"><b>本书读完了 →</b><i>去书架总览挑下一本</i></button>'}
      </div>
      <div class="rn-chapters">${chapterList.map((c) => `<button class="rn-chip ${c.id === m.id ? 'active' : ''}" onclick="showChapter('${esc(c.id)}')" title="${esc(c.title)}">${esc(String(c.no))}. ${esc(c.title)}</button>`).join('')}</div>
      ${transitIds.length ? `<div class="rn-transfer">⇄ 本章换乘：${transitIds.map((t) => {
        const b = chapterBrief(t);
        return `<a onclick="showChapter('${esc(t)}')">${esc(b.bookTitle || t)} · ${esc(b.title)}</a>`;
      }).join(' ／ ')}</div>` : ''}
    </div>`;
  app.innerHTML = `
  <div id="reader">
    <aside id="rail">
      <button id="railToggle" title="收起 / 展开检索">⟨</button>
      <div class="rail-title">卡片目录</div>
      <div id="railBody">
        <input id="railQ" placeholder="本章 / 全馆 检索…">
        <div id="railResults"></div>
      </div>
    </aside>
    <main>
      <div class="reader-tools">
        <button onclick="stampChapter('${esc(m.id)}')">盖章</button>
        <button onclick="annotateChapter('${esc(m.id)}')">批注</button>
        <button onclick="markDone('${esc(m.id)}')">标记读完</button>
        ${DEMO_MAP[m.id] ? `<button onclick="mmOpenDemo('${DEMO_MAP[m.id]}')">可玩演示</button>` : ''}
        <span id="readState"></span>
      </div>
      <div class="paper ${m.style}" id="paperBox">
        <button class="back" onclick="enter3D()">← 合上书，回到阅览室</button>
        <div class="reception">
          <div class="rc-title">接待记录 No. ${esc(callNo)}</div>
          <div>宾客：<b>${esc(m.title)}（${esc(m.year)}）</b></div>
          <div>来访目的：<b>${esc(purpose || '——')}</b></div>
          <div>当值馆员：<b>${librarian}</b></div>
          <div>楼层：<b>${esc((fl && fl.name) || bookNames[m.book] || '—')} · 等级 ${roman} · ${decayTxt}</b></div>
          <div>接待结果：<b id="receptionResult">${receptionResultHtml(m)}</b></div>
          <div style="color:#8a6d33">馆员按语：<b>${esc(LIB_NOTE[bookFloors[m.book]] || '别把纸屑抖在地上。')}</b></div>
        </div>
        <h1>${esc(m.title)} <small style="color:#6b5a3a;font-size:15px">${esc(m.title_en || '')}</small></h1>
        <div class="meta-line">${esc(bookNames[m.book] || m.book)} · ${esc(m.year)} · ${(m.tags || []).map(esc).join(' / ')}</div>
        <div class="meta-line">${(m.people || []).map((p) => esc(p.name + (p.org ? '（' + p.org + '）' : ''))).join('；')}</div>
        <div id="paperBody"></div>
        ${readNextHtml}
        <div class="paper-end">
          <button class="back" onclick="enter3D()">← 合上书，回到阅览室</button>
        </div>
      </div>
    </main>
    <aside id="notesCol">
      <div class="notes-title">页边注</div>
      <div class="ifline-card">另一条时间线 · 已拾 <span id="fragCount">0/${iflineInfo ? iflineInfo.total : 12}</span><br><small>有些纸片不在书里。</small></div>
      ${notes.length ? notes.map((n) => `
        <div class="note"${n.anchor ? ` data-anchor="${esc(n.anchor)}" title="点击跳到「${esc(n.anchor)}」"` : ''}>
          ${n.anchor ? `<div class="note-anchor"><span>〔${esc(n.anchor)}〕</span><span>↘</span></div>` : ''}
          <div class="note-text">${esc(n.text)}</div>
          <div class="note-sign">—— ${librarian}</div>
        </div>`).join('') : '<div class="notes-empty">这一章暂时没有页边注</div>'}
      ${chapterCardHtml(cardData, callNo, m.id)}
      <div id="anomalyBox">${collectAnomalyHtml(m)}</div>
      <div id="myNotes"></div>
    </aside>
  </div>
  <button class="reader-float-close" onclick="enter3D()">← 合上书</button>`;
  renderMd(main, $('#paperBody'));
  logRead(m.id);
  loadAnnotations(m.id);
  // 读到章末 → 记为「读过」；若本章有失窃页，缺口线索此刻才显形
  const endEl = document.querySelector('.paper-end');
  if (endEl && 'IntersectionObserver' in window) {
    const io = new IntersectionObserver((ents) => {
      if (!ents.some((en) => en.isIntersecting)) return;
      io.disconnect();
      const fresh = mmMarkChapterRead(m.id);
      const st = COLLECT.stolen.find((x) => x.chapter === m.id);
      if (fresh && st && collectStateOf('stolen', st.id) !== 'recovered') {
        mmToast(`读到章末——缺页 ${st.no} 的位置在展柜里显形了。`);
      }
    }, { threshold: 0.5 });
    io.observe(endEl);
  }
  setTimeout(() => tryFragmentDrop(m.id), 800);
  $('#railToggle').onclick = toggleRail;
  const qIn2 = $('#railQ');
  qIn2.value = state.query;
  qIn2.addEventListener('input', onRailInput);
  qIn2.focus();
  onRailInput();
}

function toggleRail() {
  const rail = $('#reader');
  rail.classList.toggle('rail-collapsed');
  $('#railToggle').textContent = rail.classList.contains('rail-collapsed') ? '⟩' : '⟨';
}

// ---------- 本章内查找（高亮 + 定位） ----------
function makeCtx(text, pos, len) {
  const s = Math.max(0, pos - 18);
  const e = Math.min(text.length, pos + len + 18);
  return (s > 0 ? '…' : '') + text.slice(s, e) + (e < text.length ? '…' : '');
}

function applyFind(q) {
  renderMd(state.chapterMain, $('#paperBody'));
  state.findMarks = [];
  if (!q) return;
  const walker = document.createTreeWalker($('#paperBody'), NodeFilter.SHOW_TEXT);
  const nodes = [];
  let n;
  while ((n = walker.nextNode())) nodes.push(n);
  const key = q.toLowerCase();
  for (const node of nodes) {
    const text = node.nodeValue;
    if (!text || !text.trim()) continue;
    const lower = text.toLowerCase();
    const parts = [];
    let idx = 0;
    while (true) {
      const p = lower.indexOf(key, idx);
      if (p < 0) break;
      parts.push({ start: p, end: p + key.length });
      idx = p + key.length;
    }
    if (!parts.length) continue;
    const frag = document.createDocumentFragment();
    let cursor = 0;
    for (const part of parts) {
      if (part.start > cursor) frag.appendChild(document.createTextNode(text.slice(cursor, part.start)));
      const mark = document.createElement('mark');
      mark.className = 'find';
      mark.textContent = text.slice(part.start, part.end);
      frag.appendChild(mark);
      state.findMarks.push({ mark, context: makeCtx(text, part.start, key.length) });
      cursor = part.end;
    }
    if (cursor < text.length) frag.appendChild(document.createTextNode(text.slice(cursor)));
    node.parentNode.replaceChild(frag, node);
  }
}

function renderRailResults() {
  const q = state.query;
  const box = $('#railResults');
  if (!box) return;
  let html = '';
  if (!q) {
    html = '<div class="rail-hint">敲字即搜：先在本章里找，再查全馆目录。</div>';
  } else {
    html += `<div class="rail-sec">本章命中 ${state.findMarks.length} 处</div>`;
    if (state.findMarks.length) {
      html += state.findMarks.map((m, i) => `<div class="find-item" data-i="${i}">${esc(m.context)}</div>`).join('');
    } else {
      html += '<div class="rail-hint">本章没有命中，试试全馆结果。</div>';
    }
    if (state.global.length) {
      html += '<div class="rail-sec">全馆检索</div>';
      html += state.global.map((h) => `
        <div class="rail-hit" data-id="${h.id}">
          <b>${esc(h.title)}</b>
          <span>${h.snippet}</span>
        </div>`).join('');
    }
  }
  box.innerHTML = html;
}

let findTimer = null;
let globalTimer = null;
function onRailInput() {
  const q = $('#railQ').value.trim();
  state.query = q;
  clearTimeout(findTimer);
  findTimer = setTimeout(() => {
    applyFind(q);
    renderRailResults();
  }, 120);
  clearTimeout(globalTimer);
  globalTimer = setTimeout(async () => {
    if (!q) { state.global = []; renderRailResults(); return; }
    const r = await (await fetch('api/search?q=' + encodeURIComponent(q) + '&limit=8')).json();
    state.global = r.results;
    renderRailResults();
  }, 320);
}

document.addEventListener('click', (e) => {
  const findItem = e.target.closest('.find-item');
  if (findItem) {
    const i = Number(findItem.dataset.i);
    const entry = state.findMarks[i];
    if (entry) {
      entry.mark.scrollIntoView({ behavior: 'smooth', block: 'center' });
      $('#paperBody').querySelectorAll('mark.find.active').forEach((mk) => mk.classList.remove('active'));
      entry.mark.classList.add('active');
      document.querySelectorAll('.find-item.active').forEach((it) => it.classList.remove('active'));
      findItem.classList.add('active');
    }
    return;
  }
  const railHit = e.target.closest('.rail-hit');
  if (railHit) { showChapter(railHit.dataset.id); return; }
  const note = e.target.closest('.note[data-anchor]');
  if (note) {
    const anchor = note.dataset.anchor;
    const target = [...$('#paperBody').querySelectorAll('h2')].find((h) => h.textContent.trim() === anchor);
    if (target) {
      target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      target.classList.add('flash');
      setTimeout(() => target.classList.remove('flash'), 2200);
    }
  }
});

// ---------- 书架模式检索 ----------
async function doSearch() {
  const q = $('#q').value.trim();
  if (!q) return;
  document.body.classList.add('grid');
  app.innerHTML = '<div class="empty">正在翻查卡片目录……</div>';
  const r = await (await fetch('api/search?q=' + encodeURIComponent(q))).json();
  if (!r.results.length) { app.innerHTML = '<div class="empty">目录里没有查到「' + esc(q) + '」，试试别的词（神经网络 / 符号主义 / 蛋白质）</div>'; return; }
  app.innerHTML = '<div class="results">' + r.results.map((h) => `
    <div class="hit" onclick="showChapter('${h.id}')">
      <h4>${esc(h.title)} <small style="color:#9a8a6f">${esc(h.book_title)} · 命中 ${h.score}</small></h4>
      <p>${h.snippet}</p>
    </div>`).join('') + '</div>';
}

// 输入补全（书架模式）
const qIn = $('#q');
const wrap = document.createElement('span');
wrap.style.cssText = 'position:relative;flex:0 1 420px;display:block;';
qIn.parentNode.insertBefore(wrap, qIn);
wrap.appendChild(qIn);
const sugBox = document.createElement('div');
sugBox.className = 'sugbox';
wrap.appendChild(sugBox);
let hideTimer = null;
qIn.addEventListener('input', async () => {
  const v = qIn.value.trim();
  if (!v) { sugBox.innerHTML = ''; return; }
  const r = await (await fetch('api/suggest?q=' + encodeURIComponent(v))).json();
  clearTimeout(hideTimer);
  sugBox.innerHTML = r.items.map((i) => `<div class="sug-item" data-text="${esc(i.text)}"><span>${esc(i.text)}</span><i>${esc(i.type)}</i></div>`).join('');
});
sugBox.addEventListener('mousedown', (e) => {
  const item = e.target.closest('.sug-item');
  if (item) { qIn.value = item.dataset.text; sugBox.innerHTML = ''; doSearch(); }
});
qIn.addEventListener('blur', () => { hideTimer = setTimeout(() => { sugBox.innerHTML = ''; }, 200); });
qIn.addEventListener('focus', () => clearTimeout(hideTimer));

// 初始状态：3D 阅览室由下方 module 启动；失败则回退书架列表
fetch('api/health').then((r) => r.json()).then((h) => {
  const stat = $('#stat');
  if (stat) stat.textContent = `已入库 ${h.chapters} 章`;
}).catch(() => {});
</script>

})();
