<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>机忆书库 · THE MACHINE MEMORY</title>
<style>
  :root {
    --bg: #14100d; --panel: #1d1712; --ink: #e6d9bd; --dim: #9a8a6f;
    --gold: #c8a24a; --line: #3a2f22;
    --paper-history: #e8dcc0; --paper-tech: #ccd8e4; --paper-industry: #d8d2c4; --paper-frontier: #d9c8a8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(1200px 600px at 50% -10%, #241c14, var(--bg)); color: var(--ink); font-family: "Segoe UI", "Microsoft YaHei", serif; min-height: 100vh; }
  header { padding: 18px 30px 10px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 24px; letter-spacing: 4px; color: var(--gold); font-weight: 600; }
  header .sub { color: var(--dim); font-size: 13px; }
  header .note { margin-left: auto; color: #8a7a5c; font-size: 12px; }
  .search { padding: 14px 30px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .search input { flex: 1 1 320px; min-width: 0; background: #241c14; border: 1px solid var(--line); color: var(--ink); padding: 8px 12px; font-size: 14px; outline: none; }
  .search input:focus { border-color: var(--gold); }
  .search button { position: relative; z-index: 22; background: #2c241a; color: var(--gold); border: 1px solid var(--gold); padding: 8px 16px; cursor: pointer; font-size: 13px; }
  /* 导航分组：把 12 个入口收成三组，减少首访认知负担 */
  .nav-groups { position: relative; z-index: 5; padding: 0 30px 12px; display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; border-bottom: 1px solid var(--line); }
  .nav-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .ng-label { color: #8a7a5c; font-size: 11px; letter-spacing: 3px; padding-right: 8px; border-right: 1px solid #3a2f22; margin-right: 2px; }
  .nav-group .back { margin: 0; padding: 5px 11px; font-size: 12.5px; color: #cbb892; border-color: #5a4526; background: #1f1812; }
  .nav-group .back:hover { color: var(--gold); border-color: var(--gold); background: #2c241a; }
  .search .back { color: #cbb892; border-color: #5a4526; background: #1f1812; }
  .search .back:hover { color: var(--gold); border-color: var(--gold); }
  #app { padding: 10px 30px 60px; }
  body.reading .search, body.reading .nav-groups { display: none; }
  body.reading #app { padding: 10px 18px 40px; }

  /* ---------- 书架 ---------- */
  .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .book { background: linear-gradient(160deg, #221a13, #191310); border: 1px solid var(--line); border-left: 6px solid; padding: 16px 18px; cursor: pointer; transition: transform .15s, box-shadow .15s; }
  .book:hover { transform: translateY(-3px); box-shadow: 0 10px 26px rgba(0,0,0,.5); }
  .book .call { color: var(--dim); font-size: 12px; letter-spacing: 1px; }
  .book h3 { margin: 8px 0 4px; font-size: 17px; color: var(--ink); }
  .book .en { font-size: 12px; color: var(--dim); font-style: italic; }
  .book .tags { margin-top: 8px; font-size: 12px; color: #b09a72; }
  .book .meta { margin-top: 8px; font-size: 12px; color: var(--dim); }
  .style-badge { display: inline-block; border: 1px solid var(--gold); color: var(--gold); font-size: 11px; padding: 1px 7px; margin-left: 8px; letter-spacing: 2px; }

  /* ---------- 阅读三栏 ---------- */
  #reader { display: grid; grid-template-columns: 300px minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
  #reader.rail-collapsed { grid-template-columns: 46px minmax(0, 1fr) 280px; }
  #rail { position: sticky; top: 10px; background: #1a140f; border: 1px solid var(--line); padding: 10px; min-height: 70vh; max-height: calc(100vh - 30px); display: flex; flex-direction: column; }
  #railBody { overflow-y: auto; flex: 1; }
  #reader.rail-collapsed #railBody, #reader.rail-collapsed .rail-title { display: none; }
  #railToggle { background: #2c241a; border: 1px solid var(--gold); color: var(--gold); cursor: pointer; font-size: 13px; padding: 3px 8px; align-self: flex-start; margin-bottom: 8px; }
  .rail-title { color: var(--gold); font-size: 13px; letter-spacing: 2px; margin: 4px 0 8px; }
  #railQ { width: 100%; background: #241c14; border: 1px solid var(--line); color: var(--ink); padding: 7px 10px; font-size: 13px; outline: none; }
  #railQ:focus { border-color: var(--gold); }
  #railResults { margin-top: 10px; }
  .rail-sec { color: var(--dim); font-size: 11px; letter-spacing: 1px; margin: 12px 0 6px; border-bottom: 1px dashed var(--line); padding-bottom: 4px; }
  .rail-hint { color: #7d6e55; font-size: 12px; padding: 8px 2px; }
  .find-item { background: #211a13; border-left: 2px solid #6b5a3a; padding: 6px 8px; margin-bottom: 6px; font-size: 12px; color: #cbb892; cursor: pointer; line-height: 1.5; }
  .find-item:hover { border-left-color: var(--gold); color: var(--ink); }
  .find-item.active { border-left-color: var(--gold); background: #2c241a; }
  .rail-hit { background: #211a13; border: 1px solid var(--line); padding: 8px 10px; margin-bottom: 6px; cursor: pointer; }
  .rail-hit:hover { border-color: var(--gold); }
  .rail-hit b { display: block; color: var(--gold); font-size: 12.5px; font-weight: 600; margin-bottom: 3px; }
  .rail-hit span { color: var(--dim); font-size: 11.5px; line-height: 1.5; }
  .rail-hit mark { background: #b78a2f; color: #171310; padding: 0 1px; }

  .paper { max-width: 780px; margin: 0 auto; background: var(--paper-history); color: #2c2318; padding: 40px 52px 56px; box-shadow: 0 24px 80px rgba(0,0,0,.55); border-radius: 2px; font-family: "Songti SC", "STSong", "SimSun", serif; font-size: 16px; line-height: 1.95; }
  .paper.tech { background: #d3dde8; color: #18303e; font-family: "Consolas", "Microsoft YaHei", monospace; }
  .paper.industry { background: #e2dccd; color: #33302a; }
  .paper.frontier { background: #dcc9a3; color: #3a2f1c; }
  .paper h1 { font-size: 25px; border-bottom: 2px solid #6b5a3a; padding-bottom: 10px; }
  .paper h2 { font-size: 19px; margin-top: 32px; color: #5a451f; }
  .paper a { color: #3f5f8a; }
  .paper .meta-line { color: #6b5a3a; font-size: 13px; margin-top: 6px; }
  .paper mark.find { background: #d8b45a; color: #2c2318; padding: 0 1px; border-radius: 2px; }
  .paper mark.find.active { background: #b78a2f; outline: 2px solid #8a6320; }
  .paper-end { margin-top: 46px; padding-top: 18px; border-top: 1px dashed rgba(107,90,58,.45); }
  .paper-end .back { margin-bottom: 0; }
  /* 文末「继续读」：上一章 / 下一章 / 本书目录 / 换乘章节 */
  .read-next { margin-top: 40px; border-top: 2px solid rgba(107,90,58,.42); padding-top: 16px; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; color: #3b3020; }
  .rn-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; color: #6b4f1d; letter-spacing: 2px; font-size: 13px; flex-wrap: wrap; }
  .rn-head span { color: #8a6d33; font-size: 11px; letter-spacing: 1px; }
  .rn-pair { display: flex; gap: 10px; margin: 12px 0; flex-wrap: wrap; }
  .rn-btn { flex: 1 1 200px; text-align: left; background: #f6edda; border: 1px solid #b49a68; padding: 10px 12px; cursor: pointer; font-size: 13px; color: #4a3a20; font-family: inherit; }
  .rn-btn b { display: block; color: #6b4f1d; font-size: 14px; margin-bottom: 3px; }
  .rn-btn i { font-style: normal; color: #8a7d66; font-size: 11px; line-height: 1.6; }
  .rn-btn:hover { border-color: #8a6320; background: #fff6e2; }
  .rn-btn.next { border-color: #8a6320; box-shadow: inset 0 0 0 1px rgba(200,162,74,.35); }
  .rn-btn:disabled { opacity: .55; cursor: default; }
  .rn-chapters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .rn-chip { border: 1px solid #b49a68; background: transparent; color: #5a451f; padding: 4px 9px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .rn-chip.active { background: #8a6320; color: #f6edda; border-color: #8a6320; }
  .rn-chip:hover { border-color: #8a6320; }
  .rn-transfer { margin-top: 12px; font-size: 12px; color: #6b4f1d; line-height: 1.9; }
  .rn-transfer a { color: #3f5f8a; cursor: pointer; text-decoration: none; border-bottom: 1px dotted #3f5f8a; }
  .reader-float-close { position: fixed; right: 20px; top: 14px; bottom: auto; z-index: 70; background: #241c14; color: var(--gold); border: 1px solid var(--gold); padding: 9px 15px; cursor: pointer; font-size: 13px; letter-spacing: 1px; box-shadow: 0 10px 26px rgba(0,0,0,.55); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  .reader-float-close:hover { background: #2c241a; }
  .back { background: none; border: 1px solid #6b5a3a; color: #5a451f; padding: 6px 14px; cursor: pointer; margin-bottom: 16px; font-size: 13px; }

  /* ---------- 右栏页边注 ---------- */
  #notesCol { position: sticky; top: 10px; max-height: calc(100vh - 30px); overflow-y: auto; padding: 2px 2px 20px; }
  .notes-title { color: var(--gold); font-size: 13px; letter-spacing: 3px; margin: 4px 0 10px; }
  .note { background: #f4ead1; color: #3b3020; font-family: "KaiTi", "STKaiti", "楷体", serif; font-size: 13.5px; line-height: 1.75; padding: 10px 12px; margin-bottom: 10px; border-left: 3px solid var(--gold); box-shadow: 0 5px 14px rgba(0,0,0,.4); transform: rotate(-.25deg); }
  .note:nth-child(even) { transform: rotate(.3deg); background: #efe3c6; }
  .note[data-anchor] { cursor: pointer; }
  .note[data-anchor]:hover { border-left-color: #8a6320; box-shadow: 0 6px 18px rgba(0,0,0,.5); }
  .note-anchor { display: flex; justify-content: space-between; align-items: center; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 11px; color: #8a6d33; letter-spacing: 1px; border-bottom: 1px dashed #c9b98f; padding-bottom: 4px; margin-bottom: 5px; }
  .note-sign { text-align: right; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 11px; color: #8a7a5c; margin-top: 6px; }
  .notes-empty { color: #7d6e55; font-size: 12px; }
  .ifline-card { background: #211a13; border: 1px dashed #8f7a52; color: #d8c89e; font-size: 12px; padding: 9px 11px; margin-bottom: 12px; line-height: 1.8; }
  .ifline-card small { color: #8a7a5c; font-size: 11px; }

  /* ---------- 接待卡 ---------- */
  .reception { border: 1px dashed #8f7a52; background: #f6edda; color: #3b3020; padding: 10px 14px; margin-bottom: 18px; font-family: "Consolas", "Microsoft YaHei", monospace; font-size: 12.5px; line-height: 1.85; transform: rotate(-.2deg); box-shadow: 0 4px 12px rgba(0,0,0,.25); }
  .reception .rc-title { color: #8a6d33; letter-spacing: 1px; font-size: 11px; border-bottom: 1px dashed #c9b98f; padding-bottom: 4px; margin-bottom: 6px; }
  .reception b { color: #6b4f1d; font-weight: 600; }
  .paper h2.flash { background: rgba(200,162,74,.42); box-shadow: 0 0 0 6px rgba(200,162,74,.25); border-left: 4px solid #a37c2a; padding-left: 8px; border-radius: 2px; transition: background .2s; }

  /* ---------- 索引卡检索结果（书架模式） ---------- */
  .results .hit { background: #221a13; border: 1px solid var(--line); padding: 12px 16px; margin-bottom: 10px; cursor: pointer; }
  .results .hit:hover { border-color: var(--gold); }
  .results .hit h4 { margin: 0 0 6px; color: var(--gold); font-size: 15px; }
  .results .hit p { margin: 0; font-size: 13px; color: var(--dim); }
  .results .hit p mark { background: #b78a2f; color: #171310; padding: 0 2px; }
  .sugbox { position: absolute; left: 0; right: 0; top: 100%; background: #241c14; border: 1px solid var(--gold); z-index: 20; margin-top: 2px; }
  .sug-item { display: flex; justify-content: space-between; padding: 6px 12px; cursor: pointer; font-size: 13px; color: var(--ink); }
  .sug-item:hover { background: #2c241a; }
  .sug-item i { font-style: normal; color: var(--dim); font-size: 11px; }
  .empty { color: var(--dim); padding: 40px 0; text-align: center; }

  /* ---------- 关于本馆 ---------- */
  .about-view { max-width: 920px; }
  .about-hero { border: 1px solid var(--line); background: linear-gradient(160deg, #221a13, #16100c); padding: 26px 30px; margin-bottom: 16px; }
  .about-hero h2 { color: var(--gold); font-size: 20px; letter-spacing: 3px; margin: 0 0 10px; font-weight: 500; }
  .about-lead { color: #cbb892; font-size: 14px; line-height: 2; margin: 0; }
  .about-lead b { color: var(--gold); font-weight: 600; }
  .about-facts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .about-fact { border: 1px solid #3a2f22; background: #1b1510; color: #a8977a; padding: 5px 10px; font-size: 12px; }
  .about-fact b { color: var(--gold); margin-right: 5px; }
  .about-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .about-card { background: #1b1510; border: 1px solid var(--line); padding: 15px 17px; }
  .about-card h3 { color: var(--gold); font-size: 13px; letter-spacing: 2px; margin: 0 0 8px; font-weight: 500; }
  .about-card p { color: #a8977a; font-size: 12.5px; line-height: 1.9; margin: 0; }
  .about-card p b { color: #d8c89e; }
  .about-note { margin-top: 14px; border-left: 3px solid #6b5a3a; padding-left: 12px; color: #8a7a5c; font-size: 12px; line-height: 1.9; }
  .about-note b { color: #cbb892; }

  /* 新读者教程（关于本馆内） */
  .tut { margin: 16px 0; border: 1px solid #8a6320; background: linear-gradient(165deg, #241b12, #17110c); padding: 22px 24px 18px; scroll-margin-top: 12px; }
  .tut-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; border-bottom: 1px dashed #4a3a24; padding-bottom: 10px; margin-bottom: 16px; }
  .tut-head span { color: #8a7a5c; font-size: 11px; letter-spacing: 3px; }
  .tut-head b { color: var(--gold); font-size: 16px; font-weight: 500; letter-spacing: 2px; }
  .tut-head em { margin-left: auto; font-style: normal; color: #7d6e55; font-size: 11.5px; }
  .tut-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 14px 18px; }
  .tut-step { border-left: 2px solid #4a3a24; padding: 1px 0 3px 12px; }
  .tut-num { display: block; color: #8a6320; font-family: "Consolas", monospace; font-size: 11px; letter-spacing: 2px; margin-bottom: 3px; }
  .tut-step h4 { margin: 0 0 5px; color: #e2c17c; font-size: 13.5px; font-weight: 500; letter-spacing: 1px; }
  .tut-step p { margin: 0; color: #a8977a; font-size: 12px; line-height: 1.85; }
  .tut-step p b { color: #d8c89e; }
  .tut-step kbd { display: inline-block; border: 1px solid #5a4526; background: #1b1510; color: #e2c17c; font-family: "Consolas", monospace; font-size: 11px; padding: 0 4px; margin: 0 1px; }
  .tut-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; padding-top: 14px; border-top: 1px dashed #4a3a24; }
  .tut-actions button { background: #2c241a; border: 1px solid var(--gold); color: var(--gold); padding: 7px 13px; font-size: 12.5px; cursor: pointer; font-family: inherit; }
  .tut-actions button.ghost { border-color: #5a4526; color: #cbb892; background: transparent; }
  .tut-actions button:hover { background: #3a2d1c; }
  .tut-actions .tut-first { background: #3a2b16; }
  /* 借阅档案 · 今日可做 */
  .todo-list { display: grid; gap: 8px; }
  .todo-row { display: flex; align-items: center; gap: 10px; background: #1d1712; border: 1px solid var(--line); padding: 9px 12px; flex-wrap: wrap; }
  .todo-row b { color: #cbb892; font-size: 12.5px; font-weight: 500; }
  .todo-row i { font-style: normal; color: #7d6e55; font-size: 11px; margin-left: auto; }
  .todo-row button { background: #2c241a; border: 1px solid var(--gold); color: var(--gold); padding: 5px 11px; cursor: pointer; font-size: 11.5px; font-family: inherit; }
  .todo-row button:hover { background: #3a2d1c; }

  /* 借阅徽章：读完 / 残页 / 线路 / 盖章 */
  .badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .badge { display: flex; gap: 10px; align-items: center; background: #1a140f; border: 1px solid var(--line); padding: 10px 12px; opacity: .62; }
  .badge.got { opacity: 1; border-color: #7a6330; background: #241c14; }
  .badge .seal { flex: 0 0 36px; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: "KaiTi", "STKaiti", "楷体", serif; font-size: 17px; color: #8a7a5c; border: 1px solid #5a4526; }
  .badge.got .seal { color: #f0d68a; border-color: var(--gold); box-shadow: inset 0 0 0 2px rgba(200,162,74,.18); }
  .badge b { display: block; color: #cbb892; font-size: 12.5px; font-weight: 500; }
  .badge span { display: block; color: #8a7a5c; font-size: 11px; line-height: 1.5; margin-top: 2px; }

  /* ---------- 视图切换淡入淡出 ---------- */
  #viewFade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .38s ease; z-index: 60; }
  #viewFade.on { opacity: 1; }

  /* ---------- 3D 舞台 ---------- */
  #scene3d { position: fixed; inset: 0; z-index: 0; }
  header, .search, #app { position: relative; z-index: 5; }

  /* ---------- 2D 书架视图 ---------- */
  .shelf-view { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 16px; align-items: start; }
  .shelf-elevator { position: sticky; top: 10px; background: #1a140f; border: 1px solid var(--line); padding: 12px; }
  .elev-title { color: var(--gold); font-size: 12px; letter-spacing: 2px; margin-bottom: 8px; }
  .elev-btn { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 8px 10px; background: #241c14; border: 1px solid #3a2f22; color: var(--ink); cursor: pointer; font-size: 13px; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  .elev-btn span { display: block; }
  .elev-btn i { display: block; font-style: normal; color: #8a7a5c; font-size: 11px; margin-top: 3px; }
  .elev-btn:hover { border-color: #8a6320; }
  .elev-btn.active { border-color: var(--gold); color: var(--gold); }
  .elev-welcome { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 9px; font-size: 12px; color: #cbb892; line-height: 1.7; }
  .elev-links, .head-links { margin-top: 8px; font-size: 12px; }
  .elev-links a, .head-links a { color: var(--gold); cursor: pointer; text-decoration: none; border-bottom: 1px dotted #8a6320; }
  .shelf-main { display: flex; gap: 22px; align-items: flex-end; overflow-x: auto; padding: 6px 4px 24px; }
  .unit { background: linear-gradient(180deg, #2a1d12, #1c130c); border: 9px solid #4a3420; border-radius: 3px; padding: 16px 14px 8px; min-width: 230px; box-shadow: 0 18px 42px rgba(0,0,0,.5); }
  .board { display: flex; align-items: flex-end; gap: 10px; min-height: 186px; padding: 0 6px 10px; border-bottom: 9px solid #6b4a2a; margin-bottom: 22px; }
  .board:last-child { margin-bottom: 4px; }
  .book-spine { width: 36px; height: 172px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 12px 3px 8px; border-radius: 2px; box-shadow: inset 0 0 0 2px rgba(200,162,74,.55), 0 8px 16px rgba(0,0,0,.5); transition: transform .15s; }
  .book-spine:hover { transform: translateY(-8px); }
  .book-spine .t { writing-mode: vertical-rl; font-family: "Songti SC", "SimSun", serif; font-size: 13px; letter-spacing: 2px; color: #f6ecc9; max-height: 128px; overflow: hidden; }
  .book-spine .c { font-size: 10px; color: #e2c06a; font-family: monospace; }

  /* ---------- 书架总览 ---------- */
  .overview-head { color: var(--gold); letter-spacing: 2px; font-size: 14px; margin: 4px 0 14px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .overview { display: grid; gap: 16px; max-width: 980px; }
  .overview-sec { background: #1b1510; border: 1px solid var(--line); }
  .floor-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .floor-head .fd { color: var(--gold); font-size: 13px; letter-spacing: 1px; }
  .book-row { display: grid; grid-template-columns: 46px 1.4fr 110px 1fr 84px; gap: 12px; padding: 10px 14px; border-bottom: 1px dashed #2c2116; align-items: center; cursor: pointer; }
  .book-row:last-child { border-bottom: none; }
  .book-row:hover { background: #221a13; }
  .book-row .call { color: #b09a72; font-family: monospace; font-size: 12px; }
  .book-row .bt { color: var(--ink); font-size: 14px; }

  /* ---------- 入馆登记门厅 ---------- */
  #gate { position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center; background: radial-gradient(900px 520px at 50% 28%, #2a1f14, #0c0906 72%); transition: opacity .55s ease, transform .55s ease; }
  #gate::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(200,162,74,.045) 0 2px, transparent 2px 88px); pointer-events: none; }
  #gate.leaving { pointer-events: none; background: transparent; }
  .gate-doors { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  .gate-doors .door { position: absolute; top: 0; bottom: 0; width: 50.5%; background: linear-gradient(90deg, #17110c, #2b1f13 55%, #17110c); box-shadow: inset 0 0 60px rgba(0,0,0,.7); transition: transform 1s cubic-bezier(.76,0,.24,1); }
  .gate-doors .door::after { content: ""; position: absolute; inset: 14px; border: 1px solid rgba(200,162,74,.18); }
  .gate-doors .door.left { left: 0; border-right: 1px solid #6b5a3a; transform-origin: left center; }
  .gate-doors .door.right { right: 0; border-left: 1px solid #6b5a3a; transform-origin: right center; }
  #gate.leaving .door.left { transform: translateX(-102%); }
  #gate.leaving .door.right { transform: translateX(102%); }
  .gate-card { z-index: 2; }
  #gate.leaving .gate-card { opacity: 0; transform: translateY(-12px) scale(.97); transition: opacity .3s, transform .3s; }
  .gate-card { position: relative; width: min(560px, 92vw); max-height: 92vh; overflow-y: auto; border: 1px solid #5a4526; background: linear-gradient(165deg, #1d1610, #14100c); padding: 34px 38px 28px; box-shadow: 0 30px 90px rgba(0,0,0,.7); animation: gateRise .7s cubic-bezier(.2,.8,.3,1) both; }
  @keyframes gateRise { from { opacity: 0; transform: translateY(16px) scale(.985); } to { opacity: 1; transform: none; } }
  .gate-card::after { content: ""; position: absolute; inset: 6px; border: 1px dashed rgba(200,162,74,.26); pointer-events: none; }
  .gate-kicker { color: #8a7a5c; font-size: 11px; letter-spacing: 4px; }
  .gate-title { color: var(--gold); font-size: 27px; letter-spacing: 7px; margin: 8px 0 2px; }
  .gate-en { color: #8a7a5c; font-style: italic; font-size: 12px; letter-spacing: 2px; }
  .gate-copy { color: #cbb892; font-size: 13px; line-height: 1.85; margin: 15px 0 16px; border-left: 3px solid #6b5a3a; padding-left: 10px; }
  .gate-row { margin-bottom: 10px; }
  .gate-row input { width: 100%; background: #241c14; border: 1px solid #3a2f22; color: var(--ink); padding: 10px 12px; font-size: 13px; outline: none; font-family: inherit; }
  .gate-row input:focus { border-color: var(--gold); }
  .gate-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .gate-btn { flex: 1 1 120px; padding: 10px 14px; cursor: pointer; font-size: 13px; letter-spacing: 2px; border: 1px solid var(--gold); background: #2c241a; color: var(--gold); font-family: inherit; }
  .gate-btn:hover { background: #3a2d1c; }
  .gate-btn.ghost { border-color: #5a4526; color: #cbb892; background: transparent; }
  .gate-btn.ghost:hover { border-color: var(--gold); color: var(--gold); }
  .gate-msg { min-height: 18px; color: #d08a5a; font-size: 12px; margin-top: 10px; line-height: 1.6; }
  .gate-msg.ok { color: #9ec27a; }
  .gate-foot { margin-top: 14px; border-top: 1px dashed #3a2f22; padding-top: 10px; color: #7d6e55; font-size: 11px; line-height: 1.7; }

  /* ---------- 书轨 · 主题线路图 ---------- */
  .rail-view { max-width: 1360px; }
  .rail-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; color: var(--gold); letter-spacing: 2px; font-size: 14px; margin: 4px 0 6px; }
  .rail-sub { color: var(--dim); font-size: 12px; letter-spacing: 1px; margin-bottom: 12px; line-height: 1.7; }
  .rg-toolbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 4px 0 10px; }
  .rg-depart { background: #2c241a; border: 1px solid var(--gold); color: var(--gold); padding: 7px 16px; cursor: pointer; font-size: 13px; letter-spacing: 2px; font-family: inherit; }
  .rg-depart:hover { background: #3a2d1c; }
  .rg-lines { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: #a8977a; }
  .rg-line-chip { display: inline-flex; align-items: center; gap: 5px; cursor: default; }
  .rg-line-chip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .rg-note { margin-left: auto; color: #7d6e55; font-size: 11px; }
  .rg-scroll { overflow: auto; border: 1px solid var(--line); background: linear-gradient(180deg, #17110c, #120d09); }
  .rg-svg { display: block; min-width: 1120px; }
  .rg-svg text { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  .rg-stop { cursor: pointer; }
  .rg-stop .rg-dot, .rg-stop .rg-halo { transition: opacity .15s; }
  .rg-stop:hover .rg-dot, .rg-stop.lit .rg-dot { filter: drop-shadow(0 0 7px #c8a24a); }
  .rg-stop:hover .rg-halo { opacity: .38; }
  .rg-stop .rg-label { fill: #cbb892; font-size: 11.5px; }
  .rg-stop:hover .rg-label { fill: #f0e4c8; }
  .rg-stop .rg-year { fill: #8a7a5c; font-size: 10px; font-family: monospace; }
  .rg-stop .rg-book { fill: #8a7a5c; font-size: 10px; }
  .rg-stop .rg-xfermark { fill: #c8a24a; font-size: 10px; }
  .rg-xfer { stroke: #8a6320; stroke-width: 1; fill: none; stroke-dasharray: 3 4; opacity: .16; transition: opacity .2s; }
  .rg-svg.rg-focus .rg-stop:not(.rg-hi) { opacity: .28; }
  .rg-svg.rg-focus .rg-xfer:not(.rg-hi) { opacity: .04; }
  .rg-svg.rg-focus .rg-xfer.rg-hi { opacity: .9; }
  .rg-svg.rg-focus .rg-stop.rg-hi .rg-dot { filter: drop-shadow(0 0 9px #f0d68a); }
  .rg-train { pointer-events: none; }
  .rg-hintbar { color: #7d6e55; font-size: 11px; margin-top: 10px; }
  .rail-hintbar { color: #7d6e55; font-size: 11px; margin-top: 10px; }
  /* 入场：轨道自左向右铺开，站点随后浮现；到站点亮时闪一下 */
  @keyframes rgLineIn { from { stroke-dashoffset: 1; opacity: .12; } to { stroke-dashoffset: 0; opacity: .62; } }
  .rg-lane-core { stroke-dasharray: 1; stroke-dashoffset: 1; animation: rgLineIn .8s ease forwards; }
  @keyframes rgStopIn { from { opacity: 0; } to { opacity: 1; } }
  .rg-stop { animation: rgStopIn .45s ease backwards; animation-delay: var(--d, 0ms); }
  @keyframes rgHaloFlash { 0% { opacity: .14; } 35% { opacity: .55; } 100% { opacity: .14; } }
  .rg-stop.lit .rg-halo { animation: rgHaloFlash .55s ease; }
  @keyframes rgDashRun { to { stroke-dashoffset: -7; } }
  .rg-svg.rg-focus .rg-xfer.rg-hi { animation: rgDashRun .9s linear infinite; }
  @keyframes rgDepartPulse { 0%, 100% { box-shadow: 0 0 0 rgba(200,162,74,0); } 50% { box-shadow: 0 0 14px rgba(200,162,74,.32); } }
  .rg-depart { animation: rgDepartPulse 2.8s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) {
    .rg-lane-core { animation: none; stroke-dashoffset: 0; }
    .rg-stop, .rg-stop.lit .rg-halo, .rg-depart, .rg-svg.rg-focus .rg-xfer.rg-hi { animation: none; }
  }
  @media (max-width: 760px) { .rg-note { display: none; } .rg-svg { min-width: 980px; } }

  /* ---------- 发展时间轴 ---------- */
  .tl-view { max-width: 1200px; }
  .tl-chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 14px; }
  .tl-chip { background: #241c14; border: 1px solid #3a2f22; color: #cbb892; padding: 5px 10px; font-size: 12px; cursor: pointer; font-family: inherit; }

  .museum h3, .sizes h3 { color: var(--gold); font-size: 14px; letter-spacing: 2px; margin: 0 0 4px; font-weight: 500; }
  .museum .sec-sub, .sizes .sec-sub { color: #7d6e55; font-size: 11px; margin-bottom: 12px; line-height: 1.7; }
  .fail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }

  .si-year { color: #7d6e55; font-size: 11px; margin-left: auto; }
  .size-note { color: #7d6e55; font-size: 11px; line-height: 1.6; margin-top: 4px; }
  .si-bar { height: 4px; background: #2c241a; margin-top: 6px; position: relative; overflow: hidden; }

  .size-scale { color: #7d6e55; font-size: 11px; line-height: 1.7; margin-top: 10px; border-left: 2px solid #4a3a24; padding-left: 9px; }

  /* 前沿书架：arXiv 新纸入库 */
  .fr-toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0 16px; }
  .fr-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .fr-chips button { background: #1f1812; border: 1px solid #4a3a24; color: #b09a72; padding: 5px 11px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .fr-chips button:hover { border-color: #8a6320; color: #d8c39a; }
  .fr-chips button.on { background: #3a2b16; border-color: var(--gold); color: #f0d68a; }
  .fr-updated { margin-left: auto; color: #7d6e55; font-size: 11px; letter-spacing: 1px; }
  .fr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 14px; }
  .fr-card { background: linear-gradient(160deg, #211a13, #191310); border: 1px solid var(--line); border-left: 3px solid #6b5a3a; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }

  .fr-card h3 a { color: inherit; text-decoration: none; }

  .fr-authors { color: #8a7a5c; font-size: 11.5px; line-height: 1.6; font-style: italic; }
  .fr-summary { color: #b09a72; font-size: 12px; line-height: 1.75; font-family: "Consolas", "Microsoft YaHei", monospace; }
  .fr-card details summary { color: #8a7a5c; font-size: 11.5px; cursor: pointer; outline: none; }

  .fr-actions a:hover, .fr-actions button:hover { border-color: var(--gold); color: var(--gold); }
  .fr-empty { border: 1px dashed #4a3a24; padding: 26px; text-align: center; color: #8a7a5c; font-size: 13px; line-height: 1.9; }

  /* ---------- 阅读工具条 / 轻提示 / 统计 ---------- */
  .reader-tools { max-width: 780px; margin: 0 auto 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .reader-tools button { background: #241c14; color: var(--gold); border: 1px solid #6b5a3a; padding: 6px 12px; cursor: pointer; font-size: 12px; letter-spacing: 1px; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  .reader-tools button:hover { border-color: var(--gold); }
  .reader-tools span { color: #8a7a5c; font-size: 11px; margin-left: auto; }
  #mmToast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(10px); z-index: 100; background: #2c241a; color: var(--gold); border: 1px solid var(--gold); padding: 9px 18px; font-size: 13px; letter-spacing: 1px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; }

  .stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .stat-card { background: #1d1712; border: 1px solid var(--line); padding: 12px 14px; }

  .frag-line { margin: 10px 0 14px; padding: 10px 12px; border-left: 3px solid #8a6320; background: rgba(90,69,31,.12); color: #6b4f1d; font-size: 13px; line-height: 1.8; font-family: "KaiTi", "STKaiti", serif; }

  /* ---------- 楼层平面图 ---------- */

  /* ---------- 残页拼合板 ---------- */
  .frag-board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin: 10px 0 12px; }
  .frag-slot { min-height: 74px; border: 1px dashed #b9a778; background: rgba(90,69,31,.06); padding: 5px 6px; color: #8a7a5c; font-size: 11px; line-height: 1.45; display: flex; flex-direction: column; justify-content: center; gap: 2px; cursor: pointer; min-width: 0; overflow: hidden; }
  .frag-slot b { color: #8a6d33; font-family: monospace; font-size: 10.5px; }

  .frag-slot small { color: #9a8a6f; font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .frag-slot.missing { border-style: dotted; color: #9a8a6f; cursor: default; }

  @keyframes fragShake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }
  .frag-pieces { display: flex; flex-wrap: wrap; gap: 6px; max-height: 230px; overflow-y: auto; padding: 2px; margin-bottom: 8px; }

  .frag-hints .hint-line { overflow-wrap: anywhere; }
  .frag-hints .hint-kicker { color: #8a6d33; font-size: 10.5px; letter-spacing: 2px; font-family: "Consolas", monospace; margin-bottom: 3px; }

  .frag-stage .fs-head b { color: #8a7a5c; font-family: monospace; font-size: 10.5px; }
  .frag-stage.active .fs-head b, .frag-stage.active .fs-head span { color: var(--gold); }
  .frag-stage .fs-head span { color: #9a8a6f; font-size: 12px; }
  .frag-stage p { margin: 0 0 6px; }
  .frag-stage .fs-btn { background: #2c241a; color: var(--gold); border: 1px solid #8a6320; padding: 4px 10px; cursor: pointer; font-size: 11.5px; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  .frag-stage .fs-note, .frag-stage .fs-lock { color: #7d6e55; font-size: 10.5px; letter-spacing: 1px; }

</head>
<body>
<div id="gate">
  <div class="gate-doors"><div class="door left"></div><div class="door right"></div></div>
  <div class="gate-card">
    <div class="gate-kicker">MACHINE MEMORY · FRONT DESK</div>
    <div class="gate-title">机忆书库</div>
    <div class="gate-en">THE MACHINE MEMORY · AI 知识档案馆</div>
    <p class="gate-copy">夜里十一点，书库只留前台一盏灯。请出示借书证；如果只是路过，也可以访客身份进去看看——访客照样能读全部书页，只是不能盖章、写批注、记进度。</p>
    <div class="gate-row">
      <input id="gateUser" placeholder="借书证号 / 用户名（3–32 字符）" autocomplete="username">
    </div>
    <div class="gate-row">
      <input id="gatePass" type="password" placeholder="口令（至少 8 位）" autocomplete="current-password" onkeydown="if(event.key==='Enter')gateLogin()">
    </div>
    <div class="gate-actions">
      <button class="gate-btn" onclick="gateLogin()">入馆</button>
      <button class="gate-btn ghost" onclick="gateRegister()">新办借书证</button>
      <button class="gate-btn ghost" onclick="gateGuest()">以访客身份入馆</button>
    </div>
    <div class="gate-msg" id="gateMsg"></div>
    <div class="gate-foot">馆员提示：这是一座演示用档案馆。借书证只保存在本机浏览器与馆内服务器，不对外发送。</div>
  </div>
</div>
<script>
(function gateBoot() {
  const gate = document.getElementById('gate');
  const msg = document.getElementById('gateMsg');
  const userIn = document.getElementById('gateUser');
  const passIn = document.getElementById('gatePass');
  const say = (text, ok) => { if (msg) { msg.textContent = text; msg.className = 'gate-msg' + (ok ? ' ok' : ''); } };
  const saved = localStorage.getItem('mm_gate_user');
  if (saved) userIn.value = saved;

  function closeGate(text) {
    if (text) say(text, true);
    gate.classList.add('leaving');
    setTimeout(() => {
      gate.remove();
      // 第一次入馆直接送到「关于本馆」的新读者教程；之后不再打扰
      if (!localStorage.getItem('mm_tutorial_seen')) {
        localStorage.setItem('mm_tutorial_seen', '1');
        setTimeout(() => enterTutorialPage(), 120);
        return;
      }
      // 移动端默认落在 2D 书架视图：3D 需要手动进入，避免首屏就撞上重渲染
      if (window.innerWidth < 760) {
        try {
          enterShelf('all');
          mmToast('移动端已切到书架视图；想看 3D，点顶部「3D 阅览室」。');
        } catch (e) { /* 移动端降级失败不影响入馆 */ }
      }
    }, 1150);
  }
  window.gateGuest = () => closeGate('访客入馆。书页可以读，印章就别盖了。');
  async function post(path, body) {
    const r = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    let d = {};
    try { d = await r.json(); } catch (e) { d = {}; }
    return { ok: r.ok, d };
  }
  window.gateLogin = async () => {
    const username = userIn.value.trim(), password = passIn.value;
    if (!username || !password) return say('借书证号和口令都要填。没证的话，点「新办借书证」。');
    say('正在核对借书证……');
    try {
      const { ok, d } = await post('api/login', { username, password });
      if (!ok) return say(d?.error?.message || '入馆失败，请稍后再试。');
      localStorage.setItem('mm_token', d.token);
      localStorage.setItem('mm_gate_user', d.user.username);
      closeGate(`欢迎回来，${d.user.username}。`);
    } catch (e) { say('连不上前台，请检查网络或稍后再试。'); }
  };
  window.gateRegister = async () => {
    const username = userIn.value.trim(), password = passIn.value;
    if (username.length < 3) return say('借书证号至少 3 个字符。');
    if (password.length < 8) return say('口令至少 8 位。');
    say('正在制证……');
    try {
      const { ok, d } = await post('api/register', { username, password });
      if (!ok) return say(d?.error?.message || '办证失败，请稍后再试。');
      localStorage.setItem('mm_token', d.token);
      localStorage.setItem('mm_gate_user', d.user.username);
      closeGate(`借书证办好了：${d.user.username}。`);
    } catch (e) { say('连不上前台，请检查网络或稍后再试。'); }
  };
  const token = localStorage.getItem('mm_token');
  if (token) {
    fetch('api/me', { headers: { authorization: 'Bearer ' + token } })
      .then((r) => (r.ok ? r.json() : (localStorage.removeItem('mm_token'), null)))
      .then((d) => { if (d) { userIn.value = d.user.username; say(`已识别借书证：${d.user.username}。直接入馆，或换号。`, true); } })
      .catch(() => {});
  }
})();
</script>

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function linkify(text) {
  text = esc(text);
  text = text.replace(/(https?:\/\/[^\s\)】，。]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  return text;
}
function fmtInline(text) {
  text = linkify(text);
  text = text.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  return text;
}
// 极简 Markdown：标题/列表/加粗
function renderMd(md, el) {
  const lines = md.split(/\r?\n/);
  let html = '', list = null;
  const closeList = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const line of lines) {
    if (/^##\s+/.test(line)) { closeList(); html += `<h2>${esc(line.replace(/^##\s+/, ''))}</h2>`; }
    else if (/^###\s+/.test(line)) { closeList(); html += `<h3>${esc(line.replace(/^###\s+/, ''))}</h3>`; }
    else if (/^\s*-\s+/.test(line)) { if (list !== 'ul') { closeList(); html += '<ul>'; list = 'ul'; } html += `<li>${fmtInline(line.replace(/^\s*-\s+/, ''))}</li>`; }
    else if (/^\s*\d+\.\s+/.test(line)) { if (list !== 'ol') { closeList(); html += '<ol>'; list = 'ol'; } html += `<li>${fmtInline(line.replace(/^\s*\d+\.\s+/, ''))}</li>`; }
    else if (/^---+$/.test(line.trim())) { closeList(); html += '<hr>'; }
    else if (line.trim() === '') { closeList(); }
    else { closeList(); html += `<p>${fmtInline(line)}</p>`; }
  }
  closeList();
  el.innerHTML = html;
}

function shade(hex, f) {
  const n = parseInt(String(hex || '#4a3a2e').replace('#', ''), 16);
  const r = Math.min(255, Math.round(((n >> 16) & 255) * f));
  const g = Math.min(255, Math.round(((n >> 8) & 255) * f));
  const b = Math.min(255, Math.round((n & 255) * f));
  return `rgb(${r},${g},${b})`;
}

const FRAG_LINES = [
  '别捡。那不是馆里的纸——域外书页，编号不在目录上。我劝你，忍住。别查，也别搜。',
  '第二张了。我提醒过你。……听见翻页声了吗？不是书在响。',
  '第三张。馆规写着：级别足够，什么都能读。你已经够级别了，所以我不拦。',
  '坐吧，灯给你留着。只是别问我结局——残页没有结局，只有下一页。',
];
function fragLine(collected) {
  if (collected <= 1) return FRAG_LINES[0];
  if (collected === 2) return FRAG_LINES[1];
  if (collected === 3) return FRAG_LINES[2];

}

// ---------- 异常馆藏：失窃页 / 躁动书页 / 历史分岔 ----------
const COLLECT = {
  stolen: [], restless: [], forks: [],
  states: { stolen: {}, restless: {}, forks: {} },
  meta: { stolen: {}, restless: {}, forks: {} },
  loaded: false,
};
let collectPromise = null;

function syncCollect3D() {
  if (window.mm3d && typeof window.mm3d.setCollectibleStates === 'function') {
    try { window.mm3d.setCollectibleStates({ stolen: COLLECT.states.stolen }); } catch (e) { console.warn('[collect] 3D 状态同步失败', e); }
  }
}
window.mmSyncCollect3D = syncCollect3D;

async function loadCollectData() {
  if (COLLECT.loaded) return COLLECT;
  if (collectPromise) return collectPromise;
  collectPromise = (async () => {
    const rid = encodeURIComponent(readerKey());
    const opts = { headers: authHeaders() };
    const [st, rs, fk, cs] = await Promise.all([
      fetch('api/stolen', opts).then((r) => r.json()),
      fetch('api/restless', opts).then((r) => r.json()),
      fetch('api/forks', opts).then((r) => r.json()),
      fetch('api/collectibles?reader_id=' + rid, opts).then((r) => r.json()).catch(() => ({})),
    ]);
    COLLECT.stolen = (st && st.items) || [];
    COLLECT.restless = (rs && rs.items) || [];
    COLLECT.forks = (fk && fk.items) || [];
    COLLECT.meta.stolen = st || {};
    COLLECT.meta.restless = rs || {};
    COLLECT.meta.forks = fk || {};
    COLLECT.states.stolen = (cs && cs.stolen) || {};
    COLLECT.states.restless = (cs && cs.restless) || {};
    COLLECT.states.forks = (cs && cs.forks) || {};
    COLLECT.loaded = true;
    syncCollect3D();
    return COLLECT;
  })().catch((e) => {
    console.warn('[collect] 加载失败', e);
    return COLLECT;
  });
  const out = await collectPromise;
  collectPromise = null;
  return out;
}
window.loadCollectData = loadCollectData;

async function mmCollectPost(kind, item, action, chapter) {
  try {
    const r = await fetch('api/collectibles', {
      method: 'POST',
      headers: { 'content-type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ reader_id: readerKey(), kind, item_id: item, action, chapter_id: chapter || '' }),
    });
    let d = {};
    try { d = await r.json(); } catch (e) { d = {}; }
    if (!r.ok) { mmToast((d.error && d.error.message) || '馆藏柜没有响应。'); return false; }
    const key = kind === 'fork' ? 'forks' : kind;
    if (COLLECT.states[key]) COLLECT.states[key][item] = d.state || action;
    if (kind === 'stolen') syncCollect3D();
    return true;
  } catch (e) { mmToast('连不上馆藏柜，稍后再试。'); return false; }
}

function collectItem(kind, id) {
  const list = kind === 'fork' ? COLLECT.forks : (COLLECT[kind] || []);
  return list.find((x) => x.id === id) || null;
}

function collectStateOf(kind, id) {
  const key = kind === 'fork' ? 'forks' : kind;
  return (COLLECT.states[key] || {})[id] || '';
}

function chapterNoOf(id) {
  const m = String(id || '').match(/-c(\d+)/);
  return m ? Number(m[1]) : 0;
}

function chapterLabelOf(id) {
  const book = String(id || '').split('-')[0];
  const n = chapterNoOf(id);
  return `《${bookNames[book] || book}》第 ${n || '?'} 章`;
}

function fragmentHintLine(f) {
  const where = f.chapter ? chapterLabelOf(f.chapter) : `${f.floor || '展厅'} 展厅地板`;
  return `第 ${f.order} 张 · 在 ${where} 附近`;
}

function collectCounts() {
  const stolenGot = COLLECT.stolen.filter((x) => collectStateOf('stolen', x.id) === 'recovered').length;
  const rsFound = COLLECT.restless.filter((x) => {
    const s = collectStateOf('restless', x.id);
    return s === 'found' || s === 'restored';
  }).length;
  const rsRestored = COLLECT.restless.filter((x) => collectStateOf('restless', x.id) === 'restored').length;
  const forkChosen = COLLECT.forks.filter((x) => collectStateOf('fork', x.id) === 'chosen').length;
  return {
    stolenGot, rsFound, rsRestored, forkChosen,
    stolenTotal: COLLECT.stolen.length || 9,
    restlessTotal: COLLECT.restless.length || 12,
    forkTotal: COLLECT.forks.length || 6,
  };
}

function collectAnomalyHtml(m) {
  const parts = [];
  const st = COLLECT.stolen.find((x) => x.chapter === m.id);
  if (st) {
    const got = collectStateOf('stolen', st.id) === 'recovered';
    parts.push(`
      <div class="anomaly-card stolen" onclick="mmOpenStolen('${esc(st.id)}')">
        <div class="an-head"><span>失窃页 · ${esc(st.no)}</span><span>${esc(st.floor)}</span></div>
        <b>${esc(st.title)}</b>
        ${got
          ? `<div class="an-state">已追回</div><div class="an-quote">「${esc(st.quote)}」</div>`
          : `<div class="an-text">${esc(st.missing)}</div>
            <div class="an-actions"><button onclick="event.stopPropagation();mmGoStolen('${esc(st.id)}')">去展柜 →</button></div>`}
      </div>`);
  }
  const sameBook = COLLECT.restless.filter((x) => x.book === m.book);
  for (const it of sameBook) {
    const state = collectStateOf('restless', it.id);
    const id = esc(it.id);
    if (state === 'restored') {
      if (m.id === it.findChapter || m.id === it.chapter) {
        parts.push(`
          <div class="anomaly-card restless restored" data-restless="${id}" onclick="mmOpenRestless('${id}')">
            <div class="an-head"><span>躁动书页 · ${esc(it.no)}</span><span>已归位</span></div>
            <b>${esc(it.title)}</b>
            <div class="an-state">已归位</div>
          </div>`);
      }
      continue;
    }
    if (state === 'found') {
      if (m.id === it.chapter) {
        parts.push(`
          <div class="anomaly-card restless" data-restless="${id}" onclick="mmOpenRestless('${id}')">
            <div class="an-head"><span>躁动书页 · ${esc(it.no)}</span><span>${esc(it.title)}</span></div>
            <div class="an-text">它想回到这一章。</div>
            <div class="an-actions"><button onclick="event.stopPropagation();mmRestoreRestless('${id}')">安抚并归位</button></div>
          </div>`);
      }
      continue;
    }
    if (m.id === it.findChapter) {
      parts.push(`
        <div class="anomaly-card restless" data-restless="${id}" onclick="mmOpenRestless('${id}')">
          <div class="an-head"><span>书脊里有东西在翻页 · ${esc(it.no)}</span><span>${esc(it.year)}</span></div>
          <b>${esc(it.title)}</b>
          <div class="an-actions"><button onclick="event.stopPropagation();mmFindRestless('${id}')">按住它（收容）</button></div>
        </div>`);
    } else {
      parts.push(`<div class="an-small" onclick="mmOpenRestless('${id}')">这一册里夹着一张躁动书页（${esc(it.no)}）</div>`);
    }
  }
  return parts.join('');
}

async function refreshAnomalyCards() {
  const box = document.getElementById('anomalyBox');
  if (!box || !window.__mmChapterMeta) return;
  await loadCollectData();
  box.innerHTML = collectAnomalyHtml(window.__mmChapterMeta);
}

function receptionResultHtml(m) {
  const feature = (m.features || []).find((f) => String(f).startsWith('stolen:'));
  if (!feature) return '已收编';
  const raw = String(feature).slice('stolen:'.length);
  const item = COLLECT.stolen.find((x) => x.id === raw);
  if (!item) return '已收编 · 缺一页';
  if (collectStateOf('stolen', item.id) === 'recovered') return '已补页';
  return `缺一页 · <span class="rc-link" onclick="mmGoStolen('${esc(item.id)}')">去展柜 ${esc(item.no)}</span>`;
}

function mmRefreshReception() {
  const el = document.getElementById('receptionResult');
  if (!el || !window.__mmChapterMeta) return;
  el.innerHTML = receptionResultHtml(window.__mmChapterMeta);
}

async function mmFindRestless(id) {
  const it = collectItem('restless', id);
  if (!it) return;
  const ok = await mmCollectPost('restless', id, 'find', it.findChapter);
  if (!ok) return;
  mmToast('书页安静下来了，先收容。');
  const card = document.querySelector(`.anomaly-card[data-restless="${id}"]`);
  if (card) {
    card.innerHTML = `
      <div class="an-head"><span>躁动书页 · ${esc(it.no)}</span><span>已收容</span></div>
      <b>${esc(it.title)}</b>
      <div class="an-state">已收容，去 ${esc(chapterLabelOf(it.chapter))} 归位</div>`;
  }
}

async function mmRestoreRestless(id) {
  const it = collectItem('restless', id);
  if (!it) return;
  const ok = await mmCollectPost('restless', id, 'restore', it.chapter);
  if (!ok) return;
  mmToast('安抚章已盖下');
  await refreshAnomalyCards();
}

function mmOpenRestless(id) {
  const it = collectItem('restless', id);
  if (!it) return;
  let el = document.getElementById('fragModal');
  if (!el) { el = document.createElement('div'); el.id = 'fragModal'; document.body.appendChild(el); }
  el.className = 'frag-modal';
  const state = collectStateOf('restless', it.id);
  const stateTxt = state === 'restored' ? '已归位' : (state === 'found' ? '已收容' : '未收容');
  el.innerHTML = `
    <div class="frag-box">
      <div class="frag-kicker">躁动书页 · ${esc(it.no)} · ${stateTxt}</div>
      <h3>${esc(it.title)}</h3>
      <p>${esc(it.what)}</p>
      <div class="frag-line">「${esc(it.quote)}」</div>
      <p style="color:#8a7a5c;font-size:12px">${esc(it.year)} · 收容于 ${esc(chapterLabelOf(it.findChapter))} · 归位于 ${esc(chapterLabelOf(it.chapter))}</p>
      <div class="frag-actions"><button id="fragClose">收起来</button></div>
    </div>`;
  el.querySelector('#fragClose').onclick = () => el.remove();
  el.onclick = (e) => { if (e.target === el) el.remove(); };
}
window.mmOpenRestless = mmOpenRestless;

// 读到章末即算「读过」：访客与登录用户都能用，作为失窃页追回的前置
const READ_MARK_KEY = 'mm_read_chapters';
function mmReadSet() {
  try { return new Set(JSON.parse(localStorage.getItem(READ_MARK_KEY) || '[]')); } catch (e) { return new Set(); }
}
function mmMarkChapterRead(id) {
  if (!id) return false;
  const set = mmReadSet();
  if (set.has(id)) return false;
  set.add(id);
  try { localStorage.setItem(READ_MARK_KEY, JSON.stringify([...set].slice(-400))); } catch (e) { /* 忽略 */ }
  return true;
}
function mmHasReadChapter(id) {
  return !!id && mmReadSet().has(id);
}
window.mmHasReadChapter = mmHasReadChapter;

function mmOpenStolen(id) {
  const it = collectItem('stolen', id);
  if (!it) return;
  const got = collectStateOf('stolen', it.id) === 'recovered';
  const readOk = mmHasReadChapter(it.chapter);
  let el = document.getElementById('fragModal');
  if (!el) { el = document.createElement('div'); el.id = 'fragModal'; document.body.appendChild(el); }
  el.className = 'frag-modal';
  el.innerHTML = `
    <div class="frag-box">
      <div class="frag-kicker">失窃页 · ${esc(it.no)} · ${got ? '已追回' : (readOk ? '可追回' : '线索未显形')}</div>
      <h3>${esc(it.title)}</h3>
      <p>${esc(it.what)}</p>
      ${got
        ? `<div class="frag-line">「${esc(it.quote)}」</div>`
        : `<p style="color:#6b5a3a">${esc(it.missing)}</p>`}
      <p style="color:#8a7a5c;font-size:12px">${esc(it.year)} · ${esc(it.floor)} 展柜 · 原属 ${esc(chapterLabelOf(it.chapter))}</p>
      <p style="color:#8a7a5c;font-size:12px">${esc(it.return)}</p>
      ${(!got && !readOk) ? `<div class="frag-line">这一页不在书里。先把《${esc(chapterLabelOf(it.chapter))}》读到末尾，展柜的位置才会显形。</div>` : ''}
      <div class="frag-actions">
        ${got ? '<span class="sc-done">已追回</span>'
          : (readOk
            ? `<button onclick="mmRecoverStolen('${esc(it.id)}')">追回这一页</button>`
            : `<button onclick="mmReadForStolen('${esc(it.chapter)}')">去读这一章 →</button>`)}
        <button class="ghost" onclick="mmGoStolen('${esc(it.id)}')">去展柜 →</button>
        <button id="fragClose" class="ghost">收起来</button>
      </div>
    </div>`;
  el.querySelector('#fragClose').onclick = () => el.remove();
  el.onclick = (e) => { if (e.target === el) el.remove(); };
}
window.mmOpenStolen = mmOpenStolen;

function mmReadForStolen(chapterId) {
  const el = document.getElementById('fragModal');
  if (el) el.remove();
  if (chapterId) showChapter(chapterId);
}
window.mmReadForStolen = mmReadForStolen;

async function mmRecoverStolen(id) {
  const it = collectItem('stolen', id);
  if (!it) return;
  if (!mmHasReadChapter(it.chapter)) {
    mmToast('先把这一章读到末尾，缺页的位置才会显形。');
    return;
  }
  const ok = await mmCollectPost('stolen', id, 'recover', it.chapter);
  if (!ok) return;
  mmToast('这一页追回来了。');
  await mmRefreshCollectSurfaces();
  if (document.getElementById('fragModal')) mmOpenStolen(id);
}

function mmGoStolen(id) {
  if (window.mm3d && typeof window.mm3d.focusStolen === 'function') {
    try { window.mm3d.focusStolen(id); } catch (e) { console.warn('[collect] 聚焦展柜失败', e); }
    enter3D();
    // 回到房间时 reset() 会复位镜头，等黑场淡出后再聚焦一次
    setTimeout(() => {
      try { if (window.mm3d && window.mm3d.focusStolen) window.mm3d.focusStolen(id); } catch (e) { /* 忽略 */ }
    }, 560);
  } else {
    enterStolen();
  }
}
window.mmGoStolen = mmGoStolen;

  if (document.body.classList.contains('reading')) {
    await refreshAnomalyCards();

    return;

// ---------- 前沿书架 · arXiv 定时入库 ----------
let FRONTIER_CACHE = null;
let FRONTIER_PROMISE = null;
let frontierField = '全部';

async function ensureFrontier() {
  if (FRONTIER_CACHE) return FRONTIER_CACHE;
  if (!FRONTIER_PROMISE) {
    FRONTIER_PROMISE = fetch('api/frontier')
      .then((r) => r.json())
      .then((d) => d && Array.isArray(d.items) ? d : { items: [] })
      .catch(() => ({ items: [] }))
      .finally(() => { FRONTIER_PROMISE = null; });
    FRONTIER_CACHE = await FRONTIER_PROMISE;
    return FRONTIER_CACHE;
  }
  return FRONTIER_PROMISE;
}

function mmFrontierFilter(f) {
  frontierField = f;
  showFrontier(true);
}
window.mmFrontierFilter = mmFrontierFilter;

function mmFrontierSearch(k) {
  const q = document.getElementById('q');
  if (q) q.value = k;
  doSearch();
}
window.mmFrontierSearch = mmFrontierSearch;

  document.body.classList.add('grid');

      <h3><a href="${esc(x.link)}" target="_blank" rel="noopener noreferrer">${esc(x.title)}</a></h3>
      <div class="fr-authors">${esc((x.authors || []).join('、') || '作者未列出')}</div>

      ${String(x.summary || '').length > 150 ? `<details><summary>读完整摘要（英文原文）</summary><div class="fr-summary">${esc(x.summary)}</div></details>` : ''}

      </div>

  app.innerHTML = `

      <div class="fr-chips">${fields.map((f) => `<button class="${f === frontierField ? 'on' : ''}" onclick="mmFrontierFilter('${esc(f)}')">${esc(f)}${f === '全部' ? ` · ${items.length}` : ''}</button>`).join('')}</div>

window.showFrontier = showFrontier;

// ---------- 残页拼合板 ----------
let fragMosaicCtx = null;

function fragMosaicHtml() {
  const ctx = fragMosaicCtx;
  if (!ctx) return '';
  const items = ctx.items;
  const mine = ctx.mine;
  const placed = ctx.placed;
  const collected = items.filter((f) => mine.includes(f.id));
  const hints = items.filter((f) => !mine.includes(f.id)).slice(0, 3);
  const unplaced = collected.filter((f) => !placed[f.order]);
  const pieceHtml = unplaced.map((f) => `
    <div class="frag-piece ${ctx.selected === f.id ? 'selected' : ''}" onclick="mmFragSelect('${esc(f.id)}')">
      <b>第 ${f.order} 张 · ${esc(f.id)}</b>
      <span>${esc(f.title)}</span>
      <small>${esc(String(f.text).slice(0, 40))}…</small>
    </div>`).join('');
  const slotHtml = items.map((f) => {
    const placedId = placed[f.order];
    if (placedId) {
      const pf = items.find((x) => x.id === placedId) || f;
      return `<div class="frag-slot filled" data-slot="${f.order}">
        <b>第 ${f.order} 张</b><span>${esc(pf.title)}</span><small>${esc(String(pf.text).slice(0, 18))}…</small>
      </div>`;
    }
    const got = mine.includes(f.id);
    return `<div class="frag-slot ${got ? 'open' : 'missing'}" data-slot="${f.order}" onclick="mmFragPlace(${f.order})">
      <b>第 ${f.order} 张</b><span>${got ? '待拼' : '缺页'}</span>
    </div>`;
  }).join('');
  const stage = [
    { n: 6, title: '夜访 L4', desc: '闭馆后，馆员会带你走一趟 L4 的旧纸堆。', extra: '<button class="fs-btn" onclick="mmNightVisit()">打开夜访备忘</button>' },
    { n: 9, title: '地库钥匙', desc: '钥匙挂在展厅入口附近——那本不属于任何书架的黑书。', extra: '<div class="fs-note">去 3D 展厅入口附近找那本黑书。</div>' },
    { n: 12, title: '蜡封馆员 · 结局批注', desc: '十二张拼完，L4 的门会为你留一条缝。批注在下面。', extra: '<div class="fs-note">已解锁 · 见下方蜡封批注。</div>' },
  ].map((s) => {
    const active = collected.length >= s.n;
    return `<div class="frag-stage ${active ? 'active' : ''}">
      <div class="fs-head"><b>${s.n}/12</b><span>${esc(s.title)}</span></div>
      <p>${esc(s.desc)}</p>
      ${active ? s.extra : '<i class="fs-lock">未解锁</i>'}
    </div>`;
  }).join('');
  const hintHtml = hints.length
    ? hints.map((f) => `<div class="hint-line">${esc(fragmentHintLine(f))}</div>`).join('')
    : '<div class="hint-line">十二张都在这儿了，馆员没有更多线索。</div>';
  return `
    <div class="frag-kicker">另一条时间线 · 拼合板</div>

function renderFragMosaic() {
  const el = document.getElementById('fragModal');
  if (!el || !fragMosaicCtx) return;
  el.innerHTML = `<div class="frag-box" style="width:min(760px,94vw)">${fragMosaicHtml()}</div>`;
  el.querySelector('#fragClose').onclick = () => el.remove();
  el.onclick = (e) => { if (e.target === el) el.remove(); };
}

function mmFragSelect(id) {
  if (!fragMosaicCtx) return;
  fragMosaicCtx.selected = fragMosaicCtx.selected === id ? null : id;
  renderFragMosaic();
}
window.mmFragSelect = mmFragSelect;

function mmFragPlace(slot) {
  const ctx = fragMosaicCtx;
  if (!ctx) return;
  if (ctx.placed[slot]) { mmToast('这一格已经拼好了。'); return; }
  if (!ctx.selected) { mmToast('先选一张残页。'); return; }
  const f = ctx.items.find((x) => x.id === ctx.selected);
  if (!f) { ctx.selected = null; return; }
  if (f.order !== slot) {
    const el = document.querySelector(`.frag-slot[data-slot="${slot}"]`);
    if (el) {
      el.classList.add('shake');
      setTimeout(() => el.classList.remove('shake'), 420);
    }
    mmToast('不对，这一页接不上');
    return;
  }
  ctx.placed[slot] = f.id;
  ctx.selected = null;
  renderFragMosaic();
  mmToast('接上了。');
}
window.mmFragPlace = mmFragPlace;

function mmNightVisit() {
  const el = document.getElementById('fragModal');
  if (!el || !fragMosaicCtx) return;
  const old = el.querySelector('.night-visit');
  if (old) { old.remove(); return; }
  const left = fragMosaicCtx.items.filter((f) => !fragMosaicCtx.mine.includes(f.id));
  const panel = document.createElement('div');
  panel.className = 'night-visit';
  panel.innerHTML = `
    <div class="nv-kicker">夜访 L4 · 馆员备忘</div>
    <p>今晚还能走的书架：</p>
    <ul>${left.length
      ? left.map((f) => {
        const place = f.chapter ? chapterLabelOf(f.chapter) : `${f.floor || '展厅'} 展厅地板`;
        const floorTxt = f.chapter ? (bookFloors[String(f.chapter).split('-')[0]] || f.floor) : (f.floor || '展厅');
        return `<li>第 ${f.order} 张 · ${esc(place)}（${esc(floorTxt)}）</li>`;
      }).join('')
      : '<li>没有剩余残页了。地库的门今晚不用开。</li>'}</ul>
    <div class="nv-foot">若只剩三张以内，也可以直接去展厅地板找——那里不收编号。</div>`;
  const actions = el.querySelector('.frag-actions');
  if (actions && actions.parentNode) actions.parentNode.insertBefore(panel, actions);
  else el.querySelector('.frag-box').appendChild(panel);
}

async function showStats() {
  document.body.classList.add('grid');
  state.findMarks = []; state.global = []; state.chapterMain = '';
  app.innerHTML = '<div class="empty">正在翻借阅台账……</div>';
  try {
    await loadCollectData();
    const r = await fetch('api/stats?reader_id=' + encodeURIComponent(readerKey()), { headers: authHeaders() });
    const d = await r.json();
    const totals = d.totals || {};
    const me = d.me || { reads: 0, chapters: 0, books: 0, fragments: [] };
    const maxReads = Math.max(1, ...(d.topBooks || []).map((b) => b.reads));
    const topHtml = (d.topBooks || []).length
      ? d.topBooks.map((b) => `
        <div class="bar-row" title="${esc(b.title)}">
          <span class="bl">${esc(b.call)} · ${esc(b.title)}</span>
          <span class="bar"><i style="width:${Math.round((b.reads / maxReads) * 100)}%"></i></span>
          <span class="bv">${b.reads} 次 / ${b.readers} 人</span>
        </div>`).join('')
      : '<div class="empty" style="padding:12px 0">还没有人翻书。你可以做第一个。</div>';
    const myFrags = me.fragments || [];
    const totalFrags = (d.ifline && d.ifline.total) || 8;
    const fragHtml = (d.fragments || []).map((f) => {
      const got = myFrags.includes(f.id);
      return `
      <div class="frag-chip ${got ? 'got' : ''}" ${got ? `onclick="showFragment('${f.id}')"` : ''} style="${got ? 'cursor:pointer' : ''}">
        <b>${esc(f.id)}</b>${got ? esc(f.title) : '未发现的残页'}
        <i>${got ? `已收编 · 全馆 ${f.readers} 人持有` : '藏在某一章里'}</i>
      </div>`;
    }).join('');
    const recentHtml = (me.recent || []).length
      ? me.recent.map((x) => `<div class="bar-row"><span class="bl">${esc(x.chapter_id)}</span><span class="bar"><i style="width:100%"></i></span><span class="bv">${x.times} 次</span></div>`).join('')
      : '<div class="empty" style="padding:10px 0">你还没有翻阅记录。</div>';
    // 借阅纪念：徽章由真实台账算出来（读完章数、翻过的书、残页、线路、印章）
    const rail = await ensureRail().catch(() => null);
    let catalog = [];
    try { catalog = await ensureCatalog(); } catch (e) { /* 忽略 */ }
    const bookMeta = {};
    const chapBook = {};
    catalog.forEach((b) => {
      bookMeta[b.id] = b;
      (b.chapters || []).forEach((c) => { chapBook[c.id] = b.id; });
    });
    const readBooks = new Set((me.myBooks || []).map((x) => x.book_id));
    (me.chapterIds || []).forEach((cid) => { const bid = chapBook[cid]; if (bid) readBooks.add(bid); });
    const lines = (rail && rail.lines) || [];
    const doneLines = lines.filter((l) => (l.stops || []).every((s) => readBooks.has(s.book)));
    const stampCount = me.stamps || 0;
    const badgeDefs = [
      { char: '初', title: '初次翻书', desc: '读完 1 章', got: (me.chapters || 0) >= 1 },
      { char: '十', title: '常客', desc: '读完 10 章', got: (me.chapters || 0) >= 10 },
      { char: '五', title: '通读', desc: '读完 50 章', got: (me.chapters || 0) >= 50 },
      { char: '书', title: '跨架读者', desc: '翻过 5 本书', got: readBooks.size >= 5 },
      { char: '残', title: '拾页人', desc: '收编 1 张残页', got: myFrags.length >= 1 },
      { char: '补', title: '补页人', desc: '收编 6 张残页', got: myFrags.length >= 6 },
      { char: '全', title: '完帙', desc: `收满 ${totalFrags} 张残页`, got: myFrags.length >= totalFrags },
      { char: '线', title: '巡线员', desc: '走完一条主题线路', got: doneLines.length >= 1 },
      { char: '轨', title: '全线通', desc: `走完 ${lines.length || 5} 条主线`, got: lines.length > 0 && doneLines.length >= lines.length },
      { char: '印', title: '盖章人', desc: '盖下 10 枚章', got: stampCount >= 10 },
    ];
    const gotBadges = badgeDefs.filter((b) => b.got).length;
    const badgeHtml = badgeDefs.map((b) => `
      <div class="badge ${b.got ? 'got' : ''}">
        <div class="seal">${esc(b.char)}</div>
        <div><b>${esc(b.title)}</b><span>${esc(b.desc)}</span></div>
      </div>`).join('');
    const myBooks = me.myBooks || [];
    const maxMy = Math.max(1, ...myBooks.map((x) => x.times));
    const myBooksHtml = myBooks.length
      ? myBooks.slice(0, 16).map((x) => {
        const b = bookMeta[x.book_id] || {};
        return `<div class="bar-row" title="${esc(b.title || x.book_id)}">
          <span class="bl">${esc(b.call || '')} · ${esc(b.title || x.book_id)}</span>
          <span class="bar"><i style="width:${Math.round((x.times / maxMy) * 100)}%"></i></span>

// 视图切换（黑场淡入淡出）
let viewBusy = false;
let pendingSwap = null;
let tourActive = false;
let planFloor = 'all';
let planSeq = 0;
function fadeSwap(fn, ms) {
  if (tourActive) return;
  if (viewBusy) { pendingSwap = fn; return; }
  viewBusy = true;
  window.mmViewBusy = true;
  const f = $('#viewFade');
  const speed = ms || {};
  const hard = !!speed.hard;
  const inMs = hard ? 0 : Math.max(120, Number(speed.in) || 380);
  const outMs = Math.max(140, Number(speed.out) || 380);
  const finish = () => {
    viewBusy = false;
    window.mmViewBusy = false;
    if (pendingSwap) { const p = pendingSwap; pendingSwap = null; fadeSwap(p); }
  };
  const done = () => {
    setTimeout(() => {
      if (f) { f.style.transitionDuration = outMs + 'ms'; f.classList.remove('on'); }
      setTimeout(finish, outMs + 40);
    }, 80);
  };
  if (!f) { Promise.resolve(fn()).finally(finish); return; }
  f.style.transitionDuration = inMs + 'ms';
  f.classList.add('on');
  // hard：立刻压黑并暂停 3D，把主线程让给 2D 页面渲染（书轨用）
  if (hard && speed.hide3d) document.body.classList.add('grid');
  setTimeout(async () => {
    try { await fn(); } catch (e) { console.error('[view] 切换失败', e); }
    done();
  }, hard ? 60 : inMs);
}
function enterShelf(floor) { fadeSwap(() => showShelves(floor)); }
function enterOverview() { fadeSwap(() => showOverview()); }
function enter3D() { fadeSwap(() => backToRoom()); }
// 书轨用更短的转场：快速进入这张线路图
function enterRail() { fadeSwap(() => showRail(), { hard: true, hide3d: true, out: 260 }); }
function enterTimeline() { fadeSwap(() => showTimeline()); }
function enterStolen() { fadeSwap(() => showStolenGallery()); }

function enterPlan() { fadeSwap(() => showPlan()); }

function planWorldX(wx, sideX) { return ((wx + sideX) / (2 * sideX)) * 1000; }
function planWorldY(wz) { return ((wz + 7.2) / (10.2 + 7.2)) * 760; }

function planFallbackPlan(catalog) {
  const capacity = 6; // 3 本 / 板 × 2 板，与 app3d 默认容量一致
  const units = Math.max(1, Math.ceil(catalog.length / capacity));
  const rows = Math.ceil(units / 6);
  const base = Math.floor(units / rows);
  const extra = units % rows;
  const spacing = 4.4;
  const shelves = [];
  for (let r = 0; r < rows; r++) {
    const count = base + (r < extra ? 1 : 0);
    const startX = -((count - 1) * spacing) / 2;
    const z = -5.4 + r * 2.9;
    for (let i = 0; i < count; i++) {
      const idx = shelves.length;
      shelves.push({ x: startX + i * spacing, z, bookIds: catalog.filter((b, bi) => bi % units === idx).map((b) => b.id) });
    }
  }
  return {
    room: { w: 28.5, d: 21, sideX: 14.25, backZ: -6.9, minZ: -1.5, maxZ: 9.4 },
    shelves,
    elevator: { x: -12.8, z: -0.6 },
    star: { x: 0.4, z: 0.9 },
    cabinet: { x: 10.5, z: 2.4 },
    lamp: { x: 2.6, z: 2.6 },
    hidden: { x: 0.6, z: 7.4 },
  };
}

function planShelfInfo(ids, catalog, floor) {
  const list = (ids || []).map((id) => catalog.find((b) => b.id === id)).filter(Boolean);
  const kept = floor === 'all' ? list : list.filter((b) => b.floor === floor);
  const letters = Array.from(new Set(kept.map((b) => String(b.call || '?').charAt(0)))).sort();
  return {
    n: kept.length,
    range: letters.length > 1 ? `${letters[0]}–${letters[letters.length - 1]}` : (letters[0] || ''),
  };
}

function planEnter3D(floor) {
  if (window.mm3d && typeof window.mm3d.setFloor === 'function') {
    try { window.mm3d.setFloor(floor || 'all', true); } catch (e) { console.warn('[plan] 3D 切层失败', e); }
  }
  enter3D();
}

function planOpenShelf(floor) {
  const target = floor === 'all'
    ? (window.mm3d && typeof window.mm3d.getFloor === 'function' ? window.mm3d.getFloor() : 'all')
    : floor;
  enterShelf(target);
}

let tourIndex = 0;
let tourTimer = null;
let tourPaused = false;
const TOUR_DWELL_MS = 20000;

function mmTourCardEl() {
  let el = document.getElementById('tourCard');
  if (!el) {
    el = document.createElement('div');
    el.id = 'tourCard';
    document.body.appendChild(el);
  }
  return el;
}

function mmTourPaint() {
  const bar = document.getElementById('tourBar');
  const status = document.getElementById('tourStatus');
  const btn = document.getElementById('tourPause');
  if (btn) btn.textContent = tourPaused ? '▶ 继续' : '⏸ 暂停';
  if (!bar && !status) return;
  if (!tourTimer) {
    if (bar) bar.style.width = '0%';
    if (status) status.innerHTML = '<span>▶ 自动播放 · 8 站 · 约 3 分钟</span><b>正在走向这一站…</b>';
    return;
  }
  const left = tourTimer.paused ? tourTimer.remain : Math.max(0, tourTimer.remain - (performance.now() - tourTimer.t0));
  const pct = Math.max(0, Math.min(1, 1 - left / tourTimer.dwell));
  if (bar) bar.style.width = (pct * 100).toFixed(2) + '%';
  if (status) {
    const sec = Math.ceil(Math.max(0, left) / 1000);
    status.innerHTML = `<span>${tourPaused ? '⏸ 已暂停' : '▶ 自动播放 · 8 站 · 约 3 分钟'}</span><b>${tourPaused ? '空格继续' : sec + 's 后下一站'}</b>`;
  }
}

function mmTourStopTimer() {
  if (tourTimer) { cancelAnimationFrame(tourTimer.raf); tourTimer = null; }
}

function mmTourTick() {
  if (!tourTimer || tourTimer.paused) return;
  mmTourPaint();
  const left = tourTimer.remain - (performance.now() - tourTimer.t0);
  if (left <= 0) {
    tourTimer = null;
    mmTourNext(true);
    return;
  }
  tourTimer.raf = requestAnimationFrame(mmTourTick);
}

function mmTourStartTimer(ms) {
  mmTourStopTimer();
  const dwell = Math.max(6000, Number(ms) || TOUR_DWELL_MS);
  tourTimer = { dwell, remain: dwell, t0: performance.now(), paused: tourPaused, raf: 0 };
  mmTourPaint();
  if (!tourPaused) tourTimer.raf = requestAnimationFrame(mmTourTick);
}

function mmTourPause() {
  if (!tourActive) return;
  tourPaused = true;
  if (tourTimer) {
    tourTimer.remain = Math.max(800, tourTimer.remain - (performance.now() - tourTimer.t0));
    tourTimer.paused = true;
    cancelAnimationFrame(tourTimer.raf);
  }
  mmTourPaint();
}
function mmTourResume() {
  if (!tourActive) return;
  tourPaused = false;
  if (tourTimer) {
    tourTimer.paused = false;
    tourTimer.t0 = performance.now();
    tourTimer.raf = requestAnimationFrame(mmTourTick);
  }
  mmTourPaint();
}
function mmTourToggle() { if (tourPaused) mmTourResume(); else mmTourPause(); }
window.mmTourPause = mmTourPause;
window.mmTourResume = mmTourResume;

function mmTourPrev() {
  if (!tourActive || !window.mm3d || typeof window.mm3d.tourGo !== 'function') return;

function mmTourNext() {

async function mmStartTour() {
  if (tourActive) return;
  const mm = window.mm3d;
  if (!mm || typeof mm.startTour !== 'function' || typeof mm.tourGo !== 'function') {
    mmToast('3D 阅览室还没准备好。');
    return;
  }
  if (document.body.classList.contains('reading') || document.body.classList.contains('grid')) {
    enter3D();
    await new Promise((resolve) => setTimeout(resolve, 600));
  }
  tourActive = true;
  tourPaused = false;
  mmTourStopTimer();
  try {
    mm.startTour(TOUR_STOPS, {
      onStep: (i) => {
        mmTourRenderCard(i);
        mmTourStartTimer(TOUR_STOPS[i] && TOUR_STOPS[i].dwell);
      },
      onEnd: () => {
        mmTourCleanup();
        mmToast('导览结束，馆员退回柜台后。');
      },
    });
  } catch (e) {
    console.error('[tour] 启动失败', e);
    mmTourCleanup();
    mmToast('3D 阅览室还没准备好。');
    return;
  }
  if (typeof mm.isTouring === 'function' && !mm.isTouring()) {
    mmTourCleanup();
    mmToast('导览还没能开始，稍等一下再试。');
    return;
  }
  if (!document.getElementById('tourCard')) mmTourRenderCard(0);
  mmToast('馆长导览开始：8 站，约 3 分钟；空格暂停，Esc 退出。');
}

  const tag = (e.target && e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if (e.key === 'Escape') { e.preventDefault(); mmEndTour(); }

let railCache = null;
let railPromise = null;
async function ensureRail() {
  if (railCache) return railCache;
  if (!railPromise) {
    railPromise = (async () => {
      railCache = await (await fetch('api/rail')).json();
      return railCache;
    })().finally(() => { railPromise = null; });
