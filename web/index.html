<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>机忆书库 · THE MACHINE MEMORY</title>
<style>
  :root {
    --bg: #14100d; --panel: #1d1712; --ink: #e6d9bd; --dim: #9a8a6f;
    --gold: #c8a24a; --line: #3a2f22;
    --paper-history: #e8dcc0; --paper-tech: #ccd8e4; --paper-industry: #d8d2c4; --paper-frontier: #d9c8a8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(1200px 600px at 50% -10%, #241c14, var(--bg)); color: var(--ink); font-family: "Segoe UI", "Microsoft YaHei", serif; min-height: 100vh; }
  header { padding: 18px 30px 10px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 24px; letter-spacing: 4px; color: var(--gold); font-weight: 600; }
  header .sub { color: var(--dim); font-size: 13px; }
  header .note { margin-left: auto; color: #8a7a5c; font-size: 12px; }
  .search { padding: 14px 30px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .search input { flex: 1 1 320px; min-width: 0; background: #241c14; border: 1px solid var(--line); color: var(--ink); padding: 8px 12px; font-size: 14px; outline: none; }
  .search input:focus { border-color: var(--gold); }
  .search button { background: #2c241a; color: var(--gold); border: 1px solid var(--gold); padding: 8px 16px; cursor: pointer; font-size: 13px; }
  #app { padding: 10px 30px 60px; }
  body.reading .search { display: none; }
  body.reading #app { padding: 10px 18px 40px; }

  /* ---------- 书架 ---------- */
  .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .book { background: linear-gradient(160deg, #221a13, #191310); border: 1px solid var(--line); border-left: 6px solid; padding: 16px 18px; cursor: pointer; transition: transform .15s, box-shadow .15s; }
  .book:hover { transform: translateY(-3px); box-shadow: 0 10px 26px rgba(0,0,0,.5); }
  .book .call { color: var(--dim); font-size: 12px; letter-spacing: 1px; }
  .book h3 { margin: 8px 0 4px; font-size: 17px; color: var(--ink); }
  .book .en { font-size: 12px; color: var(--dim); font-style: italic; }
  .book .tags { margin-top: 8px; font-size: 12px; color: #b09a72; }
  .book .meta { margin-top: 8px; font-size: 12px; color: var(--dim); }
  .style-badge { display: inline-block; border: 1px solid var(--gold); color: var(--gold); font-size: 11px; padding: 1px 7px; margin-left: 8px; letter-spacing: 2px; }

  /* ---------- 阅读三栏 ---------- */
  #reader { display: grid; grid-template-columns: 300px minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
  #reader.rail-collapsed { grid-template-columns: 46px minmax(0, 1fr) 280px; }
  #rail { position: sticky; top: 10px; background: #1a140f; border: 1px solid var(--line); padding: 10px; min-height: 70vh; max-height: calc(100vh - 30px); display: flex; flex-direction: column; }
  #railBody { overflow-y: auto; flex: 1; }
  #reader.rail-collapsed #railBody, #reader.rail-collapsed .rail-title { display: none; }
  #railToggle { background: #2c241a; border: 1px solid var(--gold); color: var(--gold); cursor: pointer; font-size: 13px; padding: 3px 8px; align-self: flex-start; margin-bottom: 8px; }
  .rail-title { color: var(--gold); font-size: 13px; letter-spacing: 2px; margin: 4px 0 8px; }
  #railQ { width: 100%; background: #241c14; border: 1px solid var(--line); color: var(--ink); padding: 7px 10px; font-size: 13px; outline: none; }
  #railQ:focus { border-color: var(--gold); }
  #railResults { margin-top: 10px; }
  .rail-sec { color: var(--dim); font-size: 11px; letter-spacing: 1px; margin: 12px 0 6px; border-bottom: 1px dashed var(--line); padding-bottom: 4px; }
  .rail-hint { color: #7d6e55; font-size: 12px; padding: 8px 2px; }
  .find-item { background: #211a13; border-left: 2px solid #6b5a3a; padding: 6px 8px; margin-bottom: 6px; font-size: 12px; color: #cbb892; cursor: pointer; line-height: 1.5; }
  .find-item:hover { border-left-color: var(--gold); color: var(--ink); }
  .find-item.active { border-left-color: var(--gold); background: #2c241a; }
  .rail-hit { background: #211a13; border: 1px solid var(--line); padding: 8px 10px; margin-bottom: 6px; cursor: pointer; }
  .rail-hit:hover { border-color: var(--gold); }
  .rail-hit b { display: block; color: var(--gold); font-size: 12.5px; font-weight: 600; margin-bottom: 3px; }
  .rail-hit span { color: var(--dim); font-size: 11.5px; line-height: 1.5; }
  .rail-hit mark { background: #b78a2f; color: #171310; padding: 0 1px; }

  .paper { max-width: 780px; margin: 0 auto; background: var(--paper-history); color: #2c2318; padding: 40px 52px 56px; box-shadow: 0 24px 80px rgba(0,0,0,.55); border-radius: 2px; font-family: "Songti SC", "STSong", "SimSun", serif; font-size: 16px; line-height: 1.95; }
  .paper.tech { background: #d3dde8; color: #18303e; font-family: "Consolas", "Microsoft YaHei", monospace; }
  .paper.industry { background: #e2dccd; color: #33302a; }
  .paper.frontier { background: #dcc9a3; color: #3a2f1c; }
  .paper h1 { font-size: 25px; border-bottom: 2px solid #6b5a3a; padding-bottom: 10px; }
  .paper h2 { font-size: 19px; margin-top: 32px; color: #5a451f; }
  .paper a { color: #3f5f8a; }
  .paper .meta-line { color: #6b5a3a; font-size: 13px; margin-top: 6px; }
  .paper mark.find { background: #d8b45a; color: #2c2318; padding: 0 1px; border-radius: 2px; }
  .paper mark.find.active { background: #b78a2f; outline: 2px solid #8a6320; }
  .paper-end { margin-top: 46px; padding-top: 18px; border-top: 1px dashed rgba(107,90,58,.45); }
  .paper-end .back { margin-bottom: 0; }
  .reader-float-close { position: fixed; right: 20px; top: 14px; bottom: auto; z-index: 70; background: #241c14; color: var(--gold); border: 1px solid var(--gold); padding: 9px 15px; cursor: pointer; font-size: 13px; letter-spacing: 1px; box-shadow: 0 10px 26px rgba(0,0,0,.55); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  .reader-float-close:hover { background: #2c241a; }
  .back { background: none; border: 1px solid #6b5a3a; color: #5a451f; padding: 6px 14px; cursor: pointer; margin-bottom: 16px; font-size: 13px; }

  /* ---------- 右栏页边注 ---------- */
  #notesCol { position: sticky; top: 10px; max-height: calc(100vh - 30px); overflow-y: auto; padding: 2px 2px 20px; }
  .notes-title { color: var(--gold); font-size: 13px; letter-spacing: 3px; margin: 4px 0 10px; }
  .note { background: #f4ead1; color: #3b3020; font-family: "KaiTi", "STKaiti", "楷体", serif; font-size: 13.5px; line-height: 1.75; padding: 10px 12px; margin-bottom: 10px; border-left: 3px solid var(--gold); box-shadow: 0 5px 14px rgba(0,0,0,.4); transform: rotate(-.25deg); }
  .note:nth-child(even) { transform: rotate(.3deg); background: #efe3c6; }
  .note[data-anchor] { cursor: pointer; }
  .note[data-anchor]:hover { border-left-color: #8a6320; box-shadow: 0 6px 18px rgba(0,0,0,.5); }
  .note-anchor { display: flex; justify-content: space-between; align-items: center; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 11px; color: #8a6d33; letter-spacing: 1px; border-bottom: 1px dashed #c9b98f; padding-bottom: 4px; margin-bottom: 5px; }
  .note-sign { text-align: right; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 11px; color: #8a7a5c; margin-top: 6px; }
  .notes-empty { color: #7d6e55; font-size: 12px; }
  .ifline-card { background: #211a13; border: 1px dashed #8f7a52; color: #d8c89e; font-size: 12px; padding: 9px 11px; margin-bottom: 12px; line-height: 1.8; }
  .ifline-card small { color: #8a7a5c; font-size: 11px; }

  /* ---------- 接待卡 ---------- */
  .reception { border: 1px dashed #8f7a52; background: #f6edda; color: #3b3020; padding: 10px 14px; margin-bottom: 18px; font-family: "Consolas", "Microsoft YaHei", monospace; font-size: 12.5px; line-height: 1.85; transform: rotate(-.2deg); box-shadow: 0 4px 12px rgba(0,0,0,.25); }
  .reception .rc-title { color: #8a6d33; letter-spacing: 1px; font-size: 11px; border-bottom: 1px dashed #c9b98f; padding-bottom: 4px; margin-bottom: 6px; }
  .reception b { color: #6b4f1d; font-weight: 600; }
  .paper h2.flash { background: rgba(200,162,74,.42); box-shadow: 0 0 0 6px rgba(200,162,74,.25); border-left: 4px solid #a37c2a; padding-left: 8px; border-radius: 2px; transition: background .2s; }

  /* ---------- 索引卡检索结果（书架模式） ---------- */
  .results .hit { background: #221a13; border: 1px solid var(--line); padding: 12px 16px; margin-bottom: 10px; cursor: pointer; }
  .results .hit:hover { border-color: var(--gold); }
  .results .hit h4 { margin: 0 0 6px; color: var(--gold); font-size: 15px; }
  .results .hit p { margin: 0; font-size: 13px; color: var(--dim); }
  .results .hit p mark { background: #b78a2f; color: #171310; padding: 0 2px; }
  .sugbox { position: absolute; left: 0; right: 0; top: 100%; background: #241c14; border: 1px solid var(--gold); z-index: 20; margin-top: 2px; }
  .sug-item { display: flex; justify-content: space-between; padding: 6px 12px; cursor: pointer; font-size: 13px; color: var(--ink); }
  .sug-item:hover { background: #2c241a; }
  .sug-item i { font-style: normal; color: var(--dim); font-size: 11px; }
  .empty { color: var(--dim); padding: 40px 0; text-align: center; }

  /* ---------- 视图切换淡入淡出 ---------- */
  #viewFade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .38s ease; z-index: 60; }
  #viewFade.on { opacity: 1; }

  /* ---------- 3D 舞台 ---------- */
  #scene3d { position: fixed; inset: 0; z-index: 0; }
  header, .search, #app { position: relative; z-index: 5; }

  /* ---------- 2D 书架视图 ---------- */
  .shelf-view { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 16px; align-items: start; }
  .shelf-elevator { position: sticky; top: 10px; background: #1a140f; border: 1px solid var(--line); padding: 12px; }
  .elev-title { color: var(--gold); font-size: 12px; letter-spacing: 2px; margin-bottom: 8px; }
  .elev-btn { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 8px 10px; background: #241c14; border: 1px solid #3a2f22; color: var(--ink); cursor: pointer; font-size: 13px; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  .elev-btn span { display: block; }
  .elev-btn i { display: block; font-style: normal; color: #8a7a5c; font-size: 11px; margin-top: 3px; }
  .elev-btn:hover { border-color: #8a6320; }
  .elev-btn.active { border-color: var(--gold); color: var(--gold); }
  .elev-welcome { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 9px; font-size: 12px; color: #cbb892; line-height: 1.7; }
  .elev-links, .head-links { margin-top: 8px; font-size: 12px; }
  .elev-links a, .head-links a { color: var(--gold); cursor: pointer; text-decoration: none; border-bottom: 1px dotted #8a6320; }
  .shelf-main { display: flex; gap: 22px; align-items: flex-end; overflow-x: auto; padding: 6px 4px 24px; }
  .unit { background: linear-gradient(180deg, #2a1d12, #1c130c); border: 9px solid #4a3420; border-radius: 3px; padding: 16px 14px 8px; min-width: 230px; box-shadow: 0 18px 42px rgba(0,0,0,.5); }
  .board { display: flex; align-items: flex-end; gap: 10px; min-height: 186px; padding: 0 6px 10px; border-bottom: 9px solid #6b4a2a; margin-bottom: 22px; }
  .board:last-child { margin-bottom: 4px; }
  .book-spine { width: 36px; height: 172px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 12px 3px 8px; border-radius: 2px; box-shadow: inset 0 0 0 2px rgba(200,162,74,.55), 0 8px 16px rgba(0,0,0,.5); transition: transform .15s; }
  .book-spine:hover { transform: translateY(-8px); }
  .book-spine .t { writing-mode: vertical-rl; font-family: "Songti SC", "SimSun", serif; font-size: 13px; letter-spacing: 2px; color: #f6ecc9; max-height: 128px; overflow: hidden; }
  .book-spine .c { font-size: 10px; color: #e2c06a; font-family: monospace; }

  /* ---------- 书架总览 ---------- */
  .overview-head { color: var(--gold); letter-spacing: 2px; font-size: 14px; margin: 4px 0 14px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .overview { display: grid; gap: 16px; max-width: 980px; }
  .overview-sec { background: #1b1510; border: 1px solid var(--line); }
  .floor-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .floor-head .fd { color: var(--gold); font-size: 13px; letter-spacing: 1px; }
  .book-row { display: grid; grid-template-columns: 46px 1.4fr 110px 1fr 84px; gap: 12px; padding: 10px 14px; border-bottom: 1px dashed #2c2116; align-items: center; cursor: pointer; }
  .book-row:last-child { border-bottom: none; }
  .book-row:hover { background: #221a13; }
  .book-row .call { color: #b09a72; font-family: monospace; font-size: 12px; }
  .book-row .bt { color: var(--ink); font-size: 14px; }
  .book-row .bt small { display: block; color: var(--dim); font-size: 11px; margin-top: 2px; font-style: italic; }
  .book-row .sp { color: var(--dim); font-size: 12px; }
  .book-row .tg { color: #b09a72; font-size: 12px; }
  .book-row .ch { color: var(--dim); font-size: 12px; text-align: right; }

  @media (max-width: 700px) {
    header { padding: 14px 16px 8px; gap: 8px; }
    header h1 { font-size: 18px; letter-spacing: 2px; }
    .search { padding: 10px 16px; }
    .search input { flex: 1 1 100%; }
    #app { padding: 8px 16px 40px; }
    .gate-card { padding: 24px 20px 20px; }
    .gate-title { font-size: 22px; letter-spacing: 4px; }
    .gate-btn { flex: 1 1 100%; }
  }

  @media (max-width: 1100px) {
    .shelf-view { grid-template-columns: 1fr; }
    .book-row { grid-template-columns: 46px 1fr 84px; }
    .book-row .tg, .book-row .sp { display: none; }
  }

  @media (max-width: 1200px) {
    #reader { grid-template-columns: 46px minmax(0, 1fr); }
    #reader.rail-collapsed { grid-template-columns: 46px minmax(0, 1fr); }
    #rail { grid-row: 1; }
    #notesCol { grid-column: 2; position: static; max-height: none; margin-top: 6px; }
  }
  /* ---------- 入馆登记门厅 ---------- */
  #gate { position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center; background: radial-gradient(900px 520px at 50% 28%, #2a1f14, #0c0906 72%); transition: opacity .55s ease, transform .55s ease; }
  #gate::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(200,162,74,.045) 0 2px, transparent 2px 88px); pointer-events: none; }
  #gate.leaving { pointer-events: none; background: transparent; }
  .gate-doors { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  .gate-doors .door { position: absolute; top: 0; bottom: 0; width: 50.5%; background: linear-gradient(90deg, #17110c, #2b1f13 55%, #17110c); box-shadow: inset 0 0 60px rgba(0,0,0,.7); transition: transform 1s cubic-bezier(.76,0,.24,1); }
  .gate-doors .door::after { content: ""; position: absolute; inset: 14px; border: 1px solid rgba(200,162,74,.18); }
  .gate-doors .door.left { left: 0; border-right: 1px solid #6b5a3a; transform-origin: left center; }
  .gate-doors .door.right { right: 0; border-left: 1px solid #6b5a3a; transform-origin: right center; }
  #gate.leaving .door.left { transform: translateX(-102%); }
  #gate.leaving .door.right { transform: translateX(102%); }
  .gate-card { z-index: 2; }
  #gate.leaving .gate-card { opacity: 0; transform: translateY(-12px) scale(.97); transition: opacity .3s, transform .3s; }
  .gate-card { position: relative; width: min(560px, 92vw); max-height: 92vh; overflow-y: auto; border: 1px solid #5a4526; background: linear-gradient(165deg, #1d1610, #14100c); padding: 34px 38px 28px; box-shadow: 0 30px 90px rgba(0,0,0,.7); animation: gateRise .7s cubic-bezier(.2,.8,.3,1) both; }
  @keyframes gateRise { from { opacity: 0; transform: translateY(16px) scale(.985); } to { opacity: 1; transform: none; } }
  .gate-card::after { content: ""; position: absolute; inset: 6px; border: 1px dashed rgba(200,162,74,.26); pointer-events: none; }
  .gate-kicker { color: #8a7a5c; font-size: 11px; letter-spacing: 4px; }
  .gate-title { color: var(--gold); font-size: 27px; letter-spacing: 7px; margin: 8px 0 2px; }
  .gate-en { color: #8a7a5c; font-style: italic; font-size: 12px; letter-spacing: 2px; }
  .gate-copy { color: #cbb892; font-size: 13px; line-height: 1.85; margin: 15px 0 16px; border-left: 3px solid #6b5a3a; padding-left: 10px; }
  .gate-row { margin-bottom: 10px; }
  .gate-row input { width: 100%; background: #241c14; border: 1px solid #3a2f22; color: var(--ink); padding: 10px 12px; font-size: 13px; outline: none; font-family: inherit; }
  .gate-row input:focus { border-color: var(--gold); }
  .gate-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .gate-btn { flex: 1 1 120px; padding: 10px 14px; cursor: pointer; font-size: 13px; letter-spacing: 2px; border: 1px solid var(--gold); background: #2c241a; color: var(--gold); font-family: inherit; }
  .gate-btn:hover { background: #3a2d1c; }
  .gate-btn.ghost { border-color: #5a4526; color: #cbb892; background: transparent; }
  .gate-btn.ghost:hover { border-color: var(--gold); color: var(--gold); }
  .gate-msg { min-height: 18px; color: #d08a5a; font-size: 12px; margin-top: 10px; line-height: 1.6; }
  .gate-msg.ok { color: #9ec27a; }
  .gate-foot { margin-top: 14px; border-top: 1px dashed #3a2f22; padding-top: 10px; color: #7d6e55; font-size: 11px; line-height: 1.7; }

  /* ---------- 铁路线视图 ---------- */
  .rail-view { max-width: 1200px; }
  .rail-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; color: var(--gold); letter-spacing: 2px; font-size: 14px; margin: 4px 0 6px; }
  .rail-sub { color: var(--dim); font-size: 12px; letter-spacing: 1px; margin-bottom: 16px; line-height: 1.7; }
  .rail-line { border: 1px solid var(--line); background: linear-gradient(180deg, #1c1610, #17120d); padding: 14px 16px 10px; margin-bottom: 16px; border-left: 5px solid var(--c); }
  .rail-line-head { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; margin-bottom: 4px; }
  .rail-line-head b { color: var(--c); font-size: 15px; letter-spacing: 2px; }
  .rail-line-head span { color: #a8977a; font-size: 12px; line-height: 1.6; flex: 1 1 320px; }
  .rail-stops { display: flex; align-items: flex-start; overflow-x: auto; padding: 26px 2px 8px; }
  .rail-stop { position: relative; flex: 0 0 148px; cursor: pointer; padding: 0 6px; }
  .rail-stop::before { content: ""; position: absolute; left: -6px; right: -6px; top: 33px; height: 5px; background: #4a3a24; border-top: 1px solid var(--c); border-bottom: 1px solid var(--c); opacity: .75; }
  .rail-stop:first-child::before { left: 50%; }
  .rail-stop:last-child::before { right: 50%; }
  .rail-stop:hover .rs-label { color: var(--c); }
  .rs-year { display: block; color: #8a7a5c; font-family: monospace; font-size: 11px; text-align: center; margin-bottom: 5px; }
  .rs-node { display: flex; justify-content: center; margin-bottom: 7px; }
  .rs-dot { width: 13px; height: 13px; border-radius: 50%; background: #1a140f; border: 2px solid var(--c); box-shadow: 0 0 0 3px #1a140f, 0 0 10px rgba(200,162,74,.35); }
  .rail-stop:hover .rs-dot { background: var(--c); }
  .rs-label { display: block; color: var(--ink); font-size: 12.5px; text-align: center; line-height: 1.45; }
  .rs-transfer { font-style: normal; color: var(--gold); font-size: 10px; border: 1px solid #6b5a3a; padding: 0 3px; white-space: nowrap; }
  .rs-note { display: block; color: #8a7a5c; font-size: 11px; line-height: 1.55; text-align: center; margin-top: 5px; }
  .rs-book { display: block; color: #6f6046; font-size: 10.5px; text-align: center; margin-top: 4px; font-family: monospace; }
  .rail-branch { margin: 10px 0 6px 30px; border-left: 2px dashed var(--c); padding-left: 14px; }
  .rail-branch-head { color: var(--c); font-size: 12px; letter-spacing: 1px; }
  .rail-branch-head i { font-style: normal; color: #8a7a5c; font-size: 11px; margin-left: 8px; }
  .rail-hintbar { color: #7d6e55; font-size: 11px; margin-top: 10px; }

  /* ---------- 发展时间轴 ---------- */
  .tl-view { max-width: 1200px; }
  .tl-decade { border-left: 3px solid #6b5a3a; padding: 4px 0 4px 14px; margin-bottom: 18px; }
  .tl-decade h3 { color: var(--gold); font-size: 13px; letter-spacing: 2px; margin: 0 0 8px; font-weight: 500; }
  .tl-decade h3 i { font-style: normal; color: #8a7a5c; font-size: 11px; margin-left: 8px; }
  .tl-items { display: flex; flex-wrap: wrap; gap: 8px; }

<div id="gate">
  <div class="gate-doors"><div class="door left"></div><div class="door right"></div></div>
  <div class="gate-card">
    <div class="gate-kicker">MACHINE MEMORY · FRONT DESK</div>
    <div class="gate-title">机忆书库</div>
    <div class="gate-en">THE MACHINE MEMORY · AI 知识档案馆</div>
    <p class="gate-copy">夜里十一点，书库只留前台一盏灯。请出示借书证；如果只是路过，也可以访客身份进去看看——访客照样能读全部书页，只是不能盖章、写批注、记进度。</p>
    <div class="gate-row">
      <input id="gateUser" placeholder="借书证号 / 用户名（3–32 字符）" autocomplete="username">
    </div>
    <div class="gate-row">
      <input id="gatePass" type="password" placeholder="口令（至少 8 位）" autocomplete="current-password" onkeydown="if(event.key==='Enter')gateLogin()">
    </div>
    <div class="gate-actions">
      <button class="gate-btn" onclick="gateLogin()">入馆</button>
      <button class="gate-btn ghost" onclick="gateRegister()">新办借书证</button>
      <button class="gate-btn ghost" onclick="gateGuest()">以访客身份入馆</button>
    </div>
    <div class="gate-msg" id="gateMsg"></div>
    <div class="gate-foot">馆员提示：这是一座演示用档案馆。借书证只保存在本机浏览器与馆内服务器，不对外发送。</div>
  </div>
</div>
<script>
(function gateBoot() {
  const gate = document.getElementById('gate');
  const msg = document.getElementById('gateMsg');
  const userIn = document.getElementById('gateUser');
  const passIn = document.getElementById('gatePass');
  const say = (text, ok) => { if (msg) { msg.textContent = text; msg.className = 'gate-msg' + (ok ? ' ok' : ''); } };
  const saved = localStorage.getItem('mm_gate_user');
  if (saved) userIn.value = saved;

  function closeGate(text) {
    if (text) say(text, true);
    gate.classList.add('leaving');
    setTimeout(() => {
      gate.remove();
      if (window.mmStartGuide) setTimeout(() => window.mmStartGuide(), 900);
    }, 1150);
  }
  window.gateGuest = () => closeGate('访客入馆。书页可以读，印章就别盖了。');
  async function post(path, body) {
    const r = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    let d = {};
    try { d = await r.json(); } catch (e) { d = {}; }
    return { ok: r.ok, d };
  }
  window.gateLogin = async () => {
    const username = userIn.value.trim(), password = passIn.value;
    if (!username || !password) return say('借书证号和口令都要填。没证的话，点「新办借书证」。');
    say('正在核对借书证……');
    try {
      const { ok, d } = await post('api/login', { username, password });
      if (!ok) return say(d?.error?.message || '入馆失败，请稍后再试。');
      localStorage.setItem('mm_token', d.token);
      localStorage.setItem('mm_gate_user', d.user.username);
      closeGate(`欢迎回来，${d.user.username}。`);
    } catch (e) { say('连不上前台，请检查网络或稍后再试。'); }
  };
  window.gateRegister = async () => {
    const username = userIn.value.trim(), password = passIn.value;
    if (username.length < 3) return say('借书证号至少 3 个字符。');
    if (password.length < 8) return say('口令至少 8 位。');
    say('正在制证……');
    try {
      const { ok, d } = await post('api/register', { username, password });
      if (!ok) return say(d?.error?.message || '办证失败，请稍后再试。');
      localStorage.setItem('mm_token', d.token);
      localStorage.setItem('mm_gate_user', d.user.username);
      closeGate(`借书证办好了：${d.user.username}。`);
    } catch (e) { say('连不上前台，请检查网络或稍后再试。'); }
  };
  const token = localStorage.getItem('mm_token');
  if (token) {
    fetch('api/me', { headers: { authorization: 'Bearer ' + token } })
      .then((r) => (r.ok ? r.json() : (localStorage.removeItem('mm_token'), null)))
      .then((d) => { if (d) { userIn.value = d.user.username; say(`已识别借书证：${d.user.username}。直接入馆，或换号。`, true); } })
      .catch(() => {});
  }
})();
</script>

const $ = (s) => document.querySelector(s);

const chapterFragments = {};

async function ensureShelfConfig() {

    const cfg = await (await fetch('api/shelves')).json();

  } catch (e) { console.warn('[shelves] 配置加载失败，使用默认值', e); }
  return shelfConfig;
}

async function loadMeta() {
  try {
    const [floors, frags] = await Promise.all([
      fetch('api/floors').then((r) => r.json()),
      fetch('api/fragments').then((r) => r.json()),
    ]);
    floors.forEach((f) => { floorInfo[f.id] = f; });
    iflineInfo = frags.ifline || null;
    (frags.fragments || []).forEach((fr) => { chapterFragments[fr.chapter] = fr; });

loadMeta();

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function linkify(text) {
  text = esc(text);
  text = text.replace(/(https?:\/\/[^\s\)】，。]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  return text;
}
function fmtInline(text) {
  text = linkify(text);
  text = text.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  return text;
}
// 极简 Markdown：标题/列表/加粗
function renderMd(md, el) {
  const lines = md.split(/\r?\n/);
  let html = '', list = null;
  const closeList = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const line of lines) {
    if (/^##\s+/.test(line)) { closeList(); html += `<h2>${esc(line.replace(/^##\s+/, ''))}</h2>`; }
    else if (/^###\s+/.test(line)) { closeList(); html += `<h3>${esc(line.replace(/^###\s+/, ''))}</h3>`; }
    else if (/^\s*-\s+/.test(line)) { if (list !== 'ul') { closeList(); html += '<ul>'; list = 'ul'; } html += `<li>${fmtInline(line.replace(/^\s*-\s+/, ''))}</li>`; }
    else if (/^\s*\d+\.\s+/.test(line)) { if (list !== 'ol') { closeList(); html += '<ol>'; list = 'ol'; } html += `<li>${fmtInline(line.replace(/^\s*\d+\.\s+/, ''))}</li>`; }
    else if (/^---+$/.test(line.trim())) { closeList(); html += '<hr>'; }
    else if (line.trim() === '') { closeList(); }
    else { closeList(); html += `<p>${fmtInline(line)}</p>`; }
  }
  closeList();
  el.innerHTML = html;
}

// ---------- 书架视图（2D 简化版，含电梯选层）与书架总览 ----------
let shelfFloor = 'all';
let catalogCache = [];

async function ensureFloors() {
  if (!floorInfo.L1) {
    try {
      const fs = await (await fetch('api/floors')).json();
      fs.forEach((f) => { floorInfo[f.id] = f; });
    } catch (e) { console.warn('[floors] 加载失败', e); }
  }
  return ['L1', 'L2', 'L3', 'L4'].map((id) => floorInfo[id]).filter(Boolean);
}

async function ensureCatalog() {
  if (!catalogCache.length) {
    catalogCache = await (await fetch('api/catalog')).json();
    window.mmAdoptBooks(catalogCache);
  }
  return catalogCache;
}

function shade(hex, f) {
  const n = parseInt(String(hex || '#4a3a2e').replace('#', ''), 16);
  const r = Math.min(255, Math.round(((n >> 16) & 255) * f));
  const g = Math.min(255, Math.round(((n >> 8) & 255) * f));
  const b = Math.min(255, Math.round((n & 255) * f));
  return `rgb(${r},${g},${b})`;
}

// ---------- 阅读记录 / 轻提示 / 新手引导 ----------
function mmToast(text) {
  let el = document.getElementById('mmToast');
  if (!el) { el = document.createElement('div'); el.id = 'mmToast'; document.body.appendChild(el); }
  el.textContent = text;
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('on'), 2200);
}

function readerKey() {
  let id = localStorage.getItem('mm_reader');
  if (!id) {
    id = 'v' + (crypto.randomUUID ? crypto.randomUUID().replace(/-/g, '').slice(0, 20) : String(Date.now()) + Math.random().toString(36).slice(2, 8));
    localStorage.setItem('mm_reader', id);
  }
  return id;
}
function authHeaders() {
  const token = localStorage.getItem('mm_token');
  return token ? { authorization: 'Bearer ' + token } : {};
}
async function logRead(chapterId) {
  try {
    const r = await fetch('api/reads', {
      method: 'POST',
      headers: { 'content-type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ chapter_id: chapterId, reader_id: readerKey() }),
    });
    const d = await r.json();
    const el = document.getElementById('fragCount');
    if (el && d && d.total) el.textContent = `${d.collected}/${d.total}`;
    if (d && d.fragment && d.collected != null) mmToast(`收编残页 ${d.fragment}（${d.collected}/${d.total}）`);
  } catch (e) { /* 离线也能读 */ }
}

async function stampChapter(id) {
  if (!localStorage.getItem('mm_token')) return mmToast('访客不能盖章：回首屏办一张借书证。');
  const r = await fetch('api/stamps', {
    method: 'POST', headers: { 'content-type': 'application/json', ...authHeaders() },
    body: JSON.stringify({ chapter_id: id, kind: 'chapter' }),
  });
  mmToast(r.ok ? '已盖章。' : '盖章失败，稍后再试。');
}

async function annotateChapter(id) {
  if (!localStorage.getItem('mm_token')) return mmToast('访客不能写批注：回首屏办一张借书证。');
  const sel = String(window.getSelection() || '').trim();
  const quote = sel || prompt('引文（从正文里挑一句）');
  if (!quote) return;
  const note = prompt('批注内容');
  if (!note) return;
  const r = await fetch('api/annotations', {
    method: 'POST', headers: { 'content-type': 'application/json', ...authHeaders() },
    body: JSON.stringify({ chapter_id: id, quote: quote.slice(0, 200), note }),
  });
  if (r.ok) { mmToast('批注已写入。'); loadAnnotations(id); }
  else mmToast('批注失败，稍后再试。');
}

async function markDone(id) {
  if (!localStorage.getItem('mm_token')) return mmToast('访客不能记进度：回首屏办一张借书证。');
  const r = await fetch('api/progress', {
    method: 'POST', headers: { 'content-type': 'application/json', ...authHeaders() },
    body: JSON.stringify({ chapter_id: id, state: 'done' }),
  });
  if (r.ok) {
    const s = document.getElementById('readState');
    if (s) s.textContent = '已读完';
    mmToast('已标记读完。');
  } else mmToast('记录失败，稍后再试。');
}

async function loadAnnotations(chapterId) {
  if (!localStorage.getItem('mm_token')) return;
  try {
    const r = await fetch('api/annotations?chapter_id=' + encodeURIComponent(chapterId), { headers: authHeaders() });
    if (!r.ok) return;
    const list = await r.json();
    const box = document.getElementById('myNotes');
    if (!box) return;
    box.innerHTML = list.length
      ? '<div class="notes-title" style="margin-top:16px">我的批注</div>' + list.map((a) => `
        <div class="note"><div class="note-anchor"><span>〔${esc(a.quote.slice(0, 22))}〕</span><span>批注</span></div>
        <div class="note-text">${esc(a.note)}</div></div>`).join('')
      : '';
  } catch (e) { /* 忽略 */ }
}

const GUIDE_STEPS = [
  'WASD 前后左右移动；按住鼠标左键拖动，转视角。',
  '把视线对准书架上的书，点击书脊，书会飞出来翻开。',
  '左侧墙上挂着黄铜电梯：点击它，或用右下按钮选层。',
  '顶栏可以切到书架视图、总览、铁路线、时间轴；检索框直接查全馆。',
  '阅读页右上角随时「合上书」；右侧页边注点一下会跳到正文对应段落。',
];
function startGuide() {
  if (localStorage.getItem('mm_guide_done')) return;
  if (document.getElementById('guide') || document.getElementById('gate')) return;
  let i = 0;
  const el = document.createElement('div');
  el.id = 'guide';
  document.body.appendChild(el);
  const render = () => {
    el.innerHTML = `
      <div class="g-step">入馆指引 ${i + 1} / ${GUIDE_STEPS.length}</div>
      <div class="g-text">${esc(GUIDE_STEPS[i])}</div>
      <div class="g-actions">
        <span class="g-dots">${GUIDE_STEPS.map((_, k) => (k === i ? '●' : '○')).join(' ')}</span>
        <button class="ghost" id="gSkip">跳过</button>
        <button id="gNext">${i === GUIDE_STEPS.length - 1 ? '开始' : '下一步'}</button>
      </div>`;
    el.querySelector('#gSkip').onclick = finish;
    el.querySelector('#gNext').onclick = () => { i += 1; if (i >= GUIDE_STEPS.length) finish(); else render(); };
  };
  const finish = () => { localStorage.setItem('mm_guide_done', '1'); el.remove(); };

// 视图切换（黑场淡入淡出）
let viewBusy = false;
let pendingSwap = null;
function fadeSwap(fn) {
  if (viewBusy) { pendingSwap = fn; return; }
  viewBusy = true;
  window.mmViewBusy = true;
  const f = $('#viewFade');
  const finish = () => {
    viewBusy = false;
    window.mmViewBusy = false;
    if (pendingSwap) { const p = pendingSwap; pendingSwap = null; fadeSwap(p); }
  };
  const done = () => {
    setTimeout(() => { f.classList.remove('on'); setTimeout(finish, 420); }, 80);
  };
  if (!f) { Promise.resolve(fn()).finally(finish); return; }
  f.classList.add('on');
  setTimeout(async () => {
    try { await fn(); } catch (e) { console.error('[view] 切换失败', e); }
    done();
  }, 380);
}

async function showShelves(floor) {
  shelfFloor = floor || (window.mm3d && window.mm3d.getFloor ? window.mm3d.getFloor() : shelfFloor) || 'all';
  document.body.classList.add('grid');
  state.findMarks = []; state.global = []; state.chapterMain = '';
  app.innerHTML = '<div class="empty">正在取出书架……</div>';
  const [catalog, floors] = await Promise.all([ensureCatalog(), ensureFloors()]);
  await ensureShelfConfig();
  const active = shelfFloor;
  // 与 3D 同步：在书架视图选层后，3D 也切到同一层
  if (floor && window.mm3d && window.mm3d.getFloor && window.mm3d.getFloor() !== floor) {
    try { window.mm3d.setFloor(floor, true); } catch (e) { console.warn('[sync] 3D 切层失败', e); }
  }
  const visible = active === 'all' ? catalog : catalog.filter((b) => b.floor === active);
  const perBoard = Math.max(1, Number(shelfConfig.booksPerBoard) || 3);
  const boardsPerUnit = Math.max(1, Number(shelfConfig.boardsPerUnit) || 2);
  const capacity = perBoard * boardsPerUnit;
  const cols = Math.max(1, Math.ceil(visible.length / capacity));
  const units = [];
  for (let c = 0; c < cols; c++) {
    const slice = visible.slice(c * capacity, (c + 1) * capacity);
    const boards = [];
    for (let b = 0; b < boardsPerUnit; b++) boards.push(slice.slice(b * perBoard, (b + 1) * perBoard));
    units.push({ boards });
  }
  const spineHtml = (b) => `
    <div class="book-spine" style="background:linear-gradient(180deg, ${b.color}, ${shade(b.color, 0.55)})"
         title="${esc(b.title)}（已入库 ${b.chapters.length}/8 章）" onclick="openBookFirst('${b.id}')">
      <span class="t">${esc(b.title.replace(/[《》]/g, ''))}</span>
      <span class="c">${esc(b.call)}</span>
    </div>`;
  const decayLbl = ['完好', '轻残', '中残', '高残'];
  const elevHtml = ['all', ...floors.map((f) => f.id)].map((id) => {
    const f = id === 'all' ? null : floors.find((x) => x.id === id);
    const label = f ? f.name : '全馆大厅';
    const sub = f ? `等级 ${f.tier} · ${decayLbl[f.decay] || '残'} · ${f.librarian}` : `${Math.max(1, Math.ceil(catalog.length / capacity))} 组书架 · ${catalog.length} 本`;
    return `<button class="elev-btn ${active === id ? 'active' : ''}" onclick="showShelves('${id}')"><span>${esc(label)}</span><i>${esc(sub)}</i></button>`;
  }).join('');
  const cur = active === 'all' ? null : floors.find((f) => f.id === active);
  const welcome = cur
    ? `${cur.name} · ${cur.librarian}：${cur.welcome}`
    : '全馆大厅：全馆的书架都在，慢慢看。';
  app.innerHTML = `
  <div class="shelf-view">
    <aside class="shelf-elevator">
      <div class="elev-title">黄铜电梯 · 选层</div>
      ${elevHtml}
      <div class="elev-welcome">${esc(welcome)}</div>
      <div class="elev-links"><a onclick="enterOverview()">→ 书架总览（全部书目）</a></div>
    </aside>
    <main class="shelf-main">
      ${units.map((u) => `
        <div class="unit">
          ${u.boards.map((board) => `<div class="board">${board.map(spineHtml).join('')}</div>`).join('')}
        </div>`).join('')}
      ${visible.length === 0 ? '<div class="empty">这一层暂时没有样章</div>' : ''}
    </main>
  </div>`;
}

function splitNotes(content) {
  const i = content.indexOf('## 页边注');
  if (i < 0) return { main: content, notes: [] };
  const main = content.slice(0, i);
  const notes = content.slice(i + '## 页边注'.length)
    .split(/\r?\n/).map((l) => l.trim())
    .filter((l) => l.startsWith('- '))
    .map((l) => {
      const t = l.slice(2).trim();
      const mm = t.match(/^〔(.+?)〕\s*(.+)$/);
      return mm ? { anchor: mm[1], text: mm[2] } : { anchor: '', text: t };
    });
  return { main, notes };
}

          ${n.anchor ? `<div class="note-anchor"><span>〔${esc(n.anchor)}〕</span><span>↘</span></div>` : ''}
          <div class="note-text">${esc(n.text)}</div>
          <div class="note-sign">—— ${librarian}</div>
        </div>`).join('') : '<div class="notes-empty">这一章暂时没有页边注</div>'}
      <div id="myNotes"></div>
    </aside>
  </div>
  <button class="reader-float-close" onclick="enter3D()">← 合上书</button>`;
  renderMd(main, $('#paperBody'));
  logRead(m.id);
  loadAnnotations(m.id);
  $('#railToggle').onclick = toggleRail;
  const qIn2 = $('#railQ');
  qIn2.value = state.query;
  qIn2.addEventListener('input', onRailInput);
  qIn2.focus();
  onRailInput();
}

function toggleRail() {
  const rail = $('#reader');
  rail.classList.toggle('rail-collapsed');
  $('#railToggle').textContent = rail.classList.contains('rail-collapsed') ? '⟩' : '⟨';
}

// ---------- 本章内查找（高亮 + 定位） ----------
function makeCtx(text, pos, len) {
  const s = Math.max(0, pos - 18);
  const e = Math.min(text.length, pos + len + 18);
  return (s > 0 ? '…' : '') + text.slice(s, e) + (e < text.length ? '…' : '');
}

function applyFind(q) {
  renderMd(state.chapterMain, $('#paperBody'));
  state.findMarks = [];
  if (!q) return;
  const walker = document.createTreeWalker($('#paperBody'), NodeFilter.SHOW_TEXT);
  const nodes = [];
  let n;
  while ((n = walker.nextNode())) nodes.push(n);
  const key = q.toLowerCase();
  for (const node of nodes) {
    const text = node.nodeValue;
    if (!text || !text.trim()) continue;
    const lower = text.toLowerCase();
    const parts = [];
    let idx = 0;
    while (true) {
      const p = lower.indexOf(key, idx);
      if (p < 0) break;
      parts.push({ start: p, end: p + key.length });
      idx = p + key.length;
    }
    if (!parts.length) continue;
    const frag = document.createDocumentFragment();
    let cursor = 0;
    for (const part of parts) {
      if (part.start > cursor) frag.appendChild(document.createTextNode(text.slice(cursor, part.start)));
      const mark = document.createElement('mark');
      mark.className = 'find';
      mark.textContent = text.slice(part.start, part.end);
      frag.appendChild(mark);
      state.findMarks.push({ mark, context: makeCtx(text, part.start, key.length) });
      cursor = part.end;
    }
    if (cursor < text.length) frag.appendChild(document.createTextNode(text.slice(cursor)));
    node.parentNode.replaceChild(frag, node);
  }
}

function renderRailResults() {
  const q = state.query;
  const box = $('#railResults');
  if (!box) return;
  let html = '';
  if (!q) {
    html = '<div class="rail-hint">敲字即搜：先在本章里找，再查全馆目录。</div>';
  } else {
    html += `<div class="rail-sec">本章命中 ${state.findMarks.length} 处</div>`;
    if (state.findMarks.length) {
      html += state.findMarks.map((m, i) => `<div class="find-item" data-i="${i}">${esc(m.context)}</div>`).join('');
    } else {
      html += '<div class="rail-hint">本章没有命中，试试全馆结果。</div>';
    }
    if (state.global.length) {
      html += '<div class="rail-sec">全馆检索</div>';
      html += state.global.map((h) => `
        <div class="rail-hit" data-id="${h.id}">
          <b>${esc(h.title)}</b>
          <span>${h.snippet}</span>
        </div>`).join('');
    }
  }
  box.innerHTML = html;
}

let findTimer = null;
let globalTimer = null;
function onRailInput() {
  const q = $('#railQ').value.trim();
  state.query = q;
  clearTimeout(findTimer);
  findTimer = setTimeout(() => {
    applyFind(q);
    renderRailResults();
  }, 120);
  clearTimeout(globalTimer);
  globalTimer = setTimeout(async () => {
    if (!q) { state.global = []; renderRailResults(); return; }
    const r = await (await fetch('api/search?q=' + encodeURIComponent(q) + '&limit=8')).json();
    state.global = r.results;
    renderRailResults();
  }, 320);
}

document.addEventListener('click', (e) => {
  const findItem = e.target.closest('.find-item');
  if (findItem) {
    const i = Number(findItem.dataset.i);
    const entry = state.findMarks[i];
    if (entry) {
      entry.mark.scrollIntoView({ behavior: 'smooth', block: 'center' });
      $('#paperBody').querySelectorAll('mark.find.active').forEach((mk) => mk.classList.remove('active'));
      entry.mark.classList.add('active');
      document.querySelectorAll('.find-item.active').forEach((it) => it.classList.remove('active'));
      findItem.classList.add('active');
    }
    return;
  }
  const railHit = e.target.closest('.rail-hit');
  if (railHit) { showChapter(railHit.dataset.id); return; }
  const note = e.target.closest('.note[data-anchor]');
  if (note) {
    const anchor = note.dataset.anchor;
    const target = [...$('#paperBody').querySelectorAll('h2')].find((h) => h.textContent.trim() === anchor);
    if (target) {
      target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      target.classList.add('flash');
      setTimeout(() => target.classList.remove('flash'), 2200);
    }
  }
});

// ---------- 书架模式检索 ----------
async function doSearch() {
  const q = $('#q').value.trim();
  if (!q) return;
  document.body.classList.add('grid');
  app.innerHTML = '<div class="empty">正在翻查卡片目录……</div>';
  const r = await (await fetch('api/search?q=' + encodeURIComponent(q))).json();
  if (!r.results.length) { app.innerHTML = '<div class="empty">目录里没有查到「' + esc(q) + '」，试试别的词（神经网络 / 符号主义 / 蛋白质）</div>'; return; }
  app.innerHTML = '<div class="results">' + r.results.map((h) => `
    <div class="hit" onclick="showChapter('${h.id}')">
      <h4>${esc(h.title)} <small style="color:#9a8a6f">${esc(h.book_title)} · 命中 ${h.score}</small></h4>
      <p>${h.snippet}</p>
    </div>`).join('') + '</div>';
}

// 输入补全（书架模式）
const qIn = $('#q');
const wrap = document.createElement('span');
wrap.style.cssText = 'position:relative;flex:0 1 420px;display:block;';
qIn.parentNode.insertBefore(wrap, qIn);
wrap.appendChild(qIn);
const sugBox = document.createElement('div');
sugBox.className = 'sugbox';
wrap.appendChild(sugBox);
let hideTimer = null;
qIn.addEventListener('input', async () => {
  const v = qIn.value.trim();
  if (!v) { sugBox.innerHTML = ''; return; }
  const r = await (await fetch('api/suggest?q=' + encodeURIComponent(v))).json();
  clearTimeout(hideTimer);
  sugBox.innerHTML = r.items.map((i) => `<div class="sug-item" data-text="${esc(i.text)}"><span>${esc(i.text)}</span><i>${esc(i.type)}</i></div>`).join('');
});
sugBox.addEventListener('mousedown', (e) => {
  const item = e.target.closest('.sug-item');
  if (item) { qIn.value = item.dataset.text; sugBox.innerHTML = ''; doSearch(); }
});
qIn.addEventListener('blur', () => { hideTimer = setTimeout(() => { sugBox.innerHTML = ''; }, 200); });
qIn.addEventListener('focus', () => clearTimeout(hideTimer));

// 初始状态：3D 阅览室由下方 module 启动；失败则回退书架列表
fetch('api/health').then((r) => r.json()).then((h) => {
  const stat = $('#stat');
  if (stat) stat.textContent = `已入库 ${h.chapters} 章`;
}).catch(() => {});
</script>
