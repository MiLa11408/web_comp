# 机忆书库 · nginx 子路径 /ai/ 反向代理
#
# 用法：把本段粘到站点配置的 server { ... } 内（宝塔：网站 → 设置 → 配置文件）。
# 前端已全部使用相对路径（api/...、vendor/...），因此不需要改后端路由。
#
#   /ai/      →  http://127.0.0.1:3300/
#   /ai/api/  →  http://127.0.0.1:3300/api/
#
# 注意 proxy_pass 末尾的 "/" 不能删，它负责去掉 /ai 前缀。

location = /ai {
    return 301 /ai/;
}

location /ai/ {
    proxy_pass http://127.0.0.1:3300/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    client_max_body_size 2m;

    # 基础安全头（CSP 仍保留 'unsafe-inline'：页面使用内联 onclick；
    # 下一步改事件委托后可收窄为 nonce/hash）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
}
